name: File 20 Four-Review v1.3.1 Remediation

on:
  push:
    branches:
      - codex/file20-four-review-final-2026-08-07-v1.3.1
    paths:
      - .github/file20-four-review-v131.ready

permissions:
  contents: write

concurrency:
  group: file20-four-review-v131-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Apply reviewed corrections
        run: |
          set -euo pipefail
          test -f .github/file20-four-review-v131.ready
          python .github/file20-v131-remediate.py
          python .github/file20-v131-postpatch.py
          sed -i 's/[[:space:]]\+$//' sabri-unified-application-shell/FOUR-PLAN-REVIEW-2026-08-07.md

      - name: Fresh local verification before commit
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-context-navigation.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php
          php sabri-unified-application-shell/tests/run-four-plan-harmonization.php
          for js in sabri-unified-application-shell/assets/js/*.js; do node --check "$js"; done
          grep -Fq '* Version: 1.3.1' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'Stable tag: 1.3.1' sabri-unified-application-shell/readme.txt
          ! grep -Fq 'get_search_query()' sabri-unified-application-shell/includes/class-renderer.php
          ! grep -Eq "'bottom_nav'[[:space:]]*=>[[:space:]]*true" sabri-unified-application-shell/includes/class-defaults.php
          git diff --check

      - name: Commit corrected reviewed source
        run: |
          set -euo pipefail
          rm -f .github/file20-four-review-v131.ready
          rm -f .github/file20-v131-remediate.py
          rm -f .github/file20-v131-postpatch.py
          rm -f .github/workflows/file20-four-review-v131-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: close File 20 four-review residual defects in 1.3.1'
          git push origin "HEAD:${GITHUB_REF_NAME}"
