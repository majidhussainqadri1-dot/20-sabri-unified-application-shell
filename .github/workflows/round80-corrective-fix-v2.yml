name: File 20 Round 80 Corrective Fix Executor v2

on:
  push:
    branches: [audit/file20-eighty-round-2026-08-09]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[round80-fixed-v2]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Reuse reviewed Round 80 transformation and repair validation contracts
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          wf = Path('.github/workflows/round80-corrective-fix.yml').read_text(encoding='utf-8')
          start = "          python - <<'PY'\n"
          end = "\n          PY"
          if start not in wf:
              raise SystemExit('reviewed transformation block not found')
          block = wf.split(start, 1)[1].split(end, 1)[0]
          script = textwrap.dedent(block)
          exec(compile(script, 'round80-reviewed-transform.py', 'exec'), {})

          root = Path('sabri-unified-application-shell')

          # Avoid PHP interpolation in static test literals while preserving the substantive bounded-scan assertion.
          p = root/'tests/run-create-contract-layout.php'
          s = p.read_text(encoding='utf-8')
          old = "$assert( false !== strpos( $integrations, '$per_page = 100;' ) && false !== strpos( $integrations, '$max_batches = 10;' ) && false !== strpos( $integrations, \"'status' => $scan_complete ? 'none' : 'incomplete'\" ), 'Shortcode compatibility scan is explicitly bounded and fails closed when incomplete.' );"
          new = "$assert( false !== strpos( $integrations, '$per_page = 100;' ) && false !== strpos( $integrations, '$max_batches = 10;' ) && false !== strpos( $integrations, \"'status' =>\" ) && false !== strpos( $integrations, \"'incomplete'\" ), 'Shortcode compatibility scan is explicitly bounded and fails closed when incomplete.' );"
          if old not in s: raise SystemExit('run-create generated assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Assert decoded backslash rejection without interpolating the source variable name.
          p = root/'tests/run-eighty-round-consolidation.php'
          s = p.read_text(encoding='utf-8')
          old = "$assert(false !== strpos($route, 'rawurldecode') && false !== strpos($route, \"strpos( $decoded, '\\\\' )\"), 'encoded backslash ambiguity rejected after decoding');"
          new = "$assert(false !== strpos($route, 'rawurldecode') && substr_count($route, \"'\\\\\\\\'\") >= 2, 'encoded backslash ambiguity rejected after decoding');"
          if old not in s: raise SystemExit('run-eighty generated backslash assertion not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          # Minimal WordPress test harness now exercises same-site route validation after HomeFeed retirement.
          p = root/'tests/bootstrap.php'
          s = p.read_text(encoding='utf-8')
          marker = "function wp_http_validate_url( $value ) { return (bool) filter_var( $value, FILTER_VALIDATE_URL ); }"
          if 'function wp_validate_redirect' not in s:
              if marker not in s: raise SystemExit('bootstrap URL validation marker not found')
              s = s.replace(marker, marker + "\nfunction wp_validate_redirect( $location, $fallback = '' ) { return is_string( $location ) && '' !== $location ? $location : $fallback; }", 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Validate every repository regression before committing
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l >/dev/null
          for test in sabri-unified-application-shell/tests/run*.php; do
            echo "==> ${test}"
            php "${test}"
          done
          for js in sabri-unified-application-shell/assets/js/*.js; do node --check "$js"; done
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
      - name: Commit corrected Round 80 source and tests
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-unified-application-shell .github/workflows/corrective-quality.yml EIGHTY-ROUND-REVIEW-2026-08-09.md
          git commit -m 'File 20 round 80: correct runtime and QA defects [round80-fixed-v2]'
          git push origin HEAD:audit/file20-eighty-round-2026-08-09
