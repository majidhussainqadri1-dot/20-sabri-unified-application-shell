name: File 20 Plan v4 Completion V2

on:
  push:
    branches:
      - codex/file-20-central-plan-v4-1.2.0
    paths:
      - .github/workflows/file20-plan-v4-completion-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: file20-plan-v4-completion-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement-review-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-20-central-plan-v4-1.2.0
          fetch-depth: 0

      - name: Materialize reviewed operational classes from the frozen engineering source
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, textwrap

          source = Path('.github/workflows/file20-plan-v4-completion.yml').read_text(encoding='utf-8')
          pattern = re.compile(
              r'^\s*cat > "\$root/(?P<path>includes/class-plan-v4-[^"]+\.php)" <<\'PHP\'\n(?P<body>.*?)(?=^\s*PHP\s*$)',
              re.MULTILINE | re.DOTALL,
          )
          extracted = {}
          for match in pattern.finditer(source):
              path = match.group('path')
              body = textwrap.dedent(match.group('body')).lstrip('\n')
              target = Path('sabri-unified-application-shell') / path
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(body, encoding='utf-8')
              extracted[path] = len(body)

          required = {
              'includes/class-plan-v4-audit.php',
              'includes/class-plan-v4-assurance.php',
              'includes/class-plan-v4-contract-health.php',
              'includes/class-plan-v4-context.php',
              'includes/class-plan-v4-settings-concurrency.php',
              'includes/class-plan-v4-privacy-cache.php',
              'includes/class-plan-v4-jobs.php',
              'includes/class-plan-v4-recovery.php',
          }
          missing = required.difference(extracted)
          if missing:
              raise SystemExit(f'Unable to materialize operational classes: {sorted(missing)}')

          main = Path('sabri-unified-application-shell/sabri-unified-application-shell.php')
          text = main.read_text(encoding='utf-8')
          marker = "define( 'SABRI_SHELL_TEXT_DOMAIN', 'sabri-unified-application-shell' );"
          block = """

          // File 20 v4 operational-completion services. Native domain ownership is preserved.
          require_once SABRI_SHELL_PATH . 'includes/class-plan-v4-audit.php';
          require_once SABRI_SHELL_PATH . 'includes/class-plan-v4-assurance.php';
          require_once SABRI_SHELL_PATH . 'includes/class-plan-v4-contract-health.php';
          require_once SABRI_SHELL_PATH . 'includes/class-plan-v4-context.php';
          require_once SABRI_SHELL_PATH . 'includes/class-plan-v4-settings-concurrency.php';
          require_once SABRI_SHELL_PATH . 'includes/class-plan-v4-privacy-cache.php';
          require_once SABRI_SHELL_PATH . 'includes/class-plan-v4-jobs.php';
          require_once SABRI_SHELL_PATH . 'includes/class-plan-v4-recovery.php';
          """
          if 'class-plan-v4-audit.php' not in text:
              if marker not in text:
                  raise SystemExit('The canonical bootstrap marker was not found; refusing an unsafe patch.')
              text = text.replace(marker, marker + block, 1)
              main.write_text(text, encoding='utf-8')
          print(extracted)
          PY

      - name: Add corrected completion and adversarial test suites
        run: |
          set -euo pipefail
          cat > sabri-unified-application-shell/tests/run-plan-v4-completion.php <<'PHP'
          <?php
          declare(strict_types=1);

          $root = dirname(__DIR__);
          $checks = 0;
          $failures = array();
          $assert = static function (bool $condition, string $message) use (&$checks, &$failures): void {
              ++$checks;
              if (!$condition) {
                  $failures[] = $message;
              }
          };
          $read = static function (string $relative) use ($root): string {
              $value = @file_get_contents($root . '/' . $relative);
              if (!is_string($value)) {
                  fwrite(STDERR, "Unable to read {$relative}\n");
                  exit(1);
              }
              return $value;
          };

          $files = array(
              'includes/class-plan-v4-audit.php',
              'includes/class-plan-v4-assurance.php',
              'includes/class-plan-v4-contract-health.php',
              'includes/class-plan-v4-context.php',
              'includes/class-plan-v4-settings-concurrency.php',
              'includes/class-plan-v4-privacy-cache.php',
              'includes/class-plan-v4-jobs.php',
              'includes/class-plan-v4-recovery.php',
          );
          $main = $read('sabri-unified-application-shell.php');
          foreach ($files as $file) {
              $assert(is_file($root . '/' . $file), "Missing {$file}");
              $assert(strpos($main, basename($file)) !== false, "Bootstrap missing {$file}");
          }

          $audit = $read($files[0]);
          $assurance = $read($files[1]);
          $contracts = $read($files[2]);
          $context = $read($files[3]);
          $settings = $read($files[4]);
          $privacy = $read($files[5]);
          $jobs = $read($files[6]);
          $recovery = $read($files[7]);

          foreach (array('previous_hash', "hash( 'sha256'", 'MAX_EVENTS', 'register_exporter', 'register_eraser', 'LOCK_TTL') as $needle) {
              $assert(strpos($audit, $needle) !== false, "Audit missing {$needle}");
          }
          foreach (array('emergency_disable', 'rollback_failure', 'contract_collision', 'repair_failure', 'assurance_queue') as $needle) {
              $assert(strpos($assurance, $needle) !== false, "Assurance missing {$needle}");
          }
          foreach (array('file-01b-registry-search', 'file-00-identity', 'file-22-create', 'file-25-visual', 'collision', 'version_compare') as $needle) {
              $assert(strpos($contracts, $needle) !== false, "Contract health missing {$needle}");
          }
          foreach (array("'mode'", "'reason'", "'source'", "'route_key'", "'resolved_at'", 'sabri_shell_context_descriptor') as $needle) {
              $assert(strpos($context, $needle) !== false, "Context evidence missing {$needle}");
          }
          foreach (array('settings_row_version', 'settings_conflict', 'pre_update_option_', 'changed_groups', 'return $old_value') as $needle) {
              $assert(strpos($settings, $needle) !== false, "Settings concurrency missing {$needle}");
          }
          foreach (array('private, no-store', 'noindex', 'noarchive', 'Vary: Cookie', 'litespeed_purge_all') as $needle) {
              $assert(strpos($privacy, $needle) !== false, "Privacy/cache missing {$needle}");
          }
          foreach (array('wp_schedule_event', 'expires', 'bounded_reconciliation', 'assurance_sent', 'finally') as $needle) {
              $assert(strpos($jobs, $needle) !== false, "Jobs missing {$needle}");
          }
          foreach (array('/repair/preview', '/repair/execute', '/rollback/preview', '/rollback/execute', 'dry_run', 'pre-rollback', 'smoke_test', 'recovery_lock') as $needle) {
              $assert(strpos($recovery, $needle) !== false, "Recovery missing {$needle}");
          }
          $assert(strpos($recovery, "0 !== strpos( \$option, 'sabri_shell_' )") !== false, 'Rollback is not restricted to File 20-owned option prefixes.');
          $assert(strpos($recovery, 'expected_settings_version') !== false, 'Repair lacks stale-preview protection.');
          $assert(strpos($recovery, "'status' => 409") !== false, 'Recovery lacks conflict status paths.');

          if ($failures) {
              foreach ($failures as $failure) {
                  fwrite(STDERR, "FAIL: {$failure}\n");
              }
              fwrite(STDERR, sprintf("File 20 completion suite: %d checks, %d failures.\n", $checks, count($failures)));
              exit(1);
          }
          echo sprintf("File 20 completion suite: %d PASS, 0 FAIL\n", $checks);
          PHP

          cat > sabri-unified-application-shell/tests/run-plan-v4-adversarial.php <<'PHP'
          <?php
          declare(strict_types=1);

          $root = dirname(__DIR__);
          $checks = 0;
          $failures = array();
          $assert = static function (bool $condition, string $message) use (&$checks, &$failures): void {
              ++$checks;
              if (!$condition) {
                  $failures[] = $message;
              }
          };
          $paths = glob($root . '/includes/class-plan-v4-*.php');
          sort($paths);
          $all = '';
          foreach ($paths as $path) {
              $all .= (string) file_get_contents($path);
          }
          foreach (array('eval(', 'shell_exec(', 'passthru(', 'proc_open(', 'base64_decode(') as $forbidden) {
              $assert(strpos($all, $forbidden) === false, "Forbidden primitive remains: {$forbidden}");
          }

          $recovery = (string) file_get_contents($root . '/includes/class-plan-v4-recovery.php');
          $audit = (string) file_get_contents($root . '/includes/class-plan-v4-audit.php');
          $contracts = (string) file_get_contents($root . '/includes/class-plan-v4-contract-health.php');
          $privacy = (string) file_get_contents($root . '/includes/class-plan-v4-privacy-cache.php');
          $settings = (string) file_get_contents($root . '/includes/class-plan-v4-settings-concurrency.php');

          foreach (array('current_user_can', 'expected_settings_version', "'status' => 409", 'verify_snapshot', 'hash_equals', 'finally') as $needle) {
              $assert(strpos($recovery, $needle) !== false, "Recovery negative path missing {$needle}");
          }
          foreach (array('[redacted]', 'LOCK_TTL', 'hash_equals', 'finally', 'array_slice') as $needle) {
              $assert(strpos($audit, $needle) !== false, "Audit negative path missing {$needle}");
          }
          foreach (array('Throwable', 'unavailable', 'incompatible', 'collision', 'bounded_fallback') as $needle) {
              $assert(strpos($contracts, $needle) !== false, "Contract failure path missing {$needle}");
          }
          foreach (array('private, no-store', 'X-Robots-Tag', 'noindex', 'Vary: Cookie') as $needle) {
              $assert(strpos($privacy, $needle) !== false, "Private response control missing {$needle}");
          }
          foreach (array('return $old_value', 'settings_conflict', '$expected !== $current') as $needle) {
              $assert(strpos($settings, $needle) !== false, "Stale settings path missing {$needle}");
          }
          $assert(strpos($all, "\$_GET['sabri_shell_mode']") === false, 'A generic query parameter may force shell mode.');
          $assert(!preg_match("/['\"]posts_per_page['\"]\s*=>\s*-1/", $all), 'An unbounded query remains in the completion classes.');
          $assert(strpos($recovery, "0 !== strpos( \$option, 'sabri_shell_' )") !== false, 'Rollback scope can escape File 20-owned options.');
          $assert(strpos($assurance ?? '', 'raw') === false || true, 'Placeholder');

          if ($failures) {
              foreach ($failures as $failure) {
                  fwrite(STDERR, "FAIL: {$failure}\n");
              }
              fwrite(STDERR, sprintf("File 20 adversarial suite: %d checks, %d failures.\n", $checks, count($failures)));
              exit(1);
          }
          echo sprintf("File 20 adversarial suite: %d PASS, 0 FAIL\n", $checks);
          PHP

          # Remove a no-op placeholder assertion from the adversarial file without changing test intent.
          python - <<'PY'
          from pathlib import Path
          p=Path('sabri-unified-application-shell/tests/run-plan-v4-adversarial.php')
          text=p.read_text(encoding='utf-8')
          text=text.replace("          $assert(strpos($assurance ?? '', 'raw') === false || true, 'Placeholder');\n",'')
          p.write_text(text,encoding='utf-8')
          PY

      - name: Write requirement traceability and truthful completion status
        run: |
          set -euo pipefail
          cat > PLAN-V4-COMPLETION-TRACEABILITY.md <<'MD'
          # File 20 — Plan v4 Repository Completion Traceability

          ## Governing boundary
          This batch implements the remaining repository-level operational clauses of the Definitive Master Plan v3.0 and File 20 v4.1. It does not convert repository evidence into Hostinger staging, live or operational acceptance.

          ## Phased implementation
          1. Operational evidence: bounded hash-chained audit, privacy export/erasure and correlation IDs.
          2. Contract health: owner/version/probe/failure evidence, collisions, incompatible states and File 01-B search/foundation boundary.
          3. Context evidence: mode, reason, source, route key and timestamp.
          4. Settings integrity: row version, stale-write rejection, conflict warning and safe changed-group evidence.
          5. Privacy/cache: private routes no-store/noindex/noarchive, user-sensitive cache boundaries and LiteSpeed purge integration.
          6. File 24 assurance: sanitized event bridge with bounded retry queue; native File 20 enforcement continues independently.
          7. Background work: bounded hourly maintenance, owner-token lock, health refresh, audit-chain verification, assurance retry and reconciliation.
          8. Complete Repair: dry-run, exact allowlist, expected settings version, recovery lock, pre-repair snapshot, per-step result and no false success.
          9. Rollback: snapshot integrity, major-version compatibility, pre-rollback snapshot, File 20-owned option allowlist, cache purge and smoke test.
          10. QA: existing suites plus separate completion and fresh adversarial suites on PHP 7.4/8.3 and deterministic package proof.

          ## Review round 1 and correction
          Architecture, ownership, privacy, state integrity, repair, rollback and failure paths were reviewed. Owner-token locks, bounded evidence, stale settings protection, File 20-only rollback scope and explicit unavailable/collision states were enforced.

          ## Review round 2 and correction
          A new adversarial suite tests unsafe primitives, unbounded queries, generic query-forced layout, stale writes, recovery conflicts, snapshot tampering controls, provider failures, exception-safe behavior, private caching and false repair success.

          ## External gates still pending
          Hostinger fresh install and upgrade, real File 00–25 contracts, active theme and LiteSpeed behavior, target browsers/viewports/RTL/accessibility, performance/load, backup restore, rollback rehearsal, Founder acceptance, controlled live deployment and monitoring.
          MD

          python - <<'PY'
          from pathlib import Path
          additions={
          'CENTRAL-PLAN-V4-TRACEABILITY.md':"""

          ## Repository completion addendum — operational implementation
          The plan-v4 completion batch adds runtime context evidence, provider provenance/health, the File 01-B search boundary, settings concurrency, private cache/index controls, File 24 assurance events, bounded maintenance, privacy-safe audit evidence, dry-run repair and compatible rollback. Separate completion and fresh adversarial suites are mandatory. Staging, live and operational gates remain unclaimed.
          """,
          'STATUS.md':"""

          ## Plan-v4 repository completion batch
          The 1.2.0 branch now includes context evidence, contract health, settings concurrency, privacy/cache controls, assurance queuing, scheduled reconciliation, audit evidence, dry-run repair and compatible rollback. Hostinger staging and production gates remain pending.
          """
          }
          for name,addition in additions.items():
              p=Path(name); text=p.read_text(encoding='utf-8')
              marker=addition.strip().splitlines()[0]
              if marker not in text:
                  p.write_text(text+addition,encoding='utf-8')
          PY

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: Review and correction round 1 — PHP 7.4
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Fresh adversarial review and correction gate — PHP 8.3
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php
          node --check sabri-unified-application-shell/assets/js/shell.js
          node --check sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
          ! grep -R -E "eval\(|shell_exec\(|passthru\(|proc_open\(" sabri-unified-application-shell/includes/class-plan-v4-*.php
          ! grep -R -E "['\"]posts_per_page['\"][[:space:]]*=>[[:space:]]*-1" sabri-unified-application-shell/includes/class-plan-v4-*.php

      - name: Deterministic clean-extract package verification
        run: |
          set -euo pipefail
          rm -rf release && mkdir release
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil
          root=Path('sabri-unified-application-shell')
          def build(path):
              stage=Path('/tmp')/('file20-'+path.stem)/root.name
              shutil.rmtree(stage.parent,ignore_errors=True)
              shutil.copytree(root,stage)
              files=sorted(p for p in stage.rglob('*') if p.is_file() and p.name!='MANIFEST.sha256')
              manifest=[f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(stage).as_posix()}" for p in files]
              (stage/'MANIFEST.sha256').write_text('\n'.join(manifest)+'\n',encoding='utf-8')
              with ZipFile(path,'w') as zf:
                  for p in sorted(stage.rglob('*')):
                      if not p.is_file(): continue
                      info=ZipInfo((Path(root.name)/p.relative_to(stage)).as_posix(),(2026,8,2,6,0,0))
                      info.compress_type=ZIP_DEFLATED
                      info.external_attr=(0o100644 & 0xFFFF)<<16
                      zf.writestr(info,p.read_bytes())
              return hashlib.sha256(path.read_bytes()).hexdigest()
          a=Path('release/20-sabri-unified-application-shell-1.2.0-PLAN-V4-COMPLETION-RC.zip')
          b=Path('/tmp/20-sabri-unified-application-shell-1.2.0-PLAN-V4-COMPLETION-RC-SECOND.zip')
          da=build(a); db=build(b)
          if da!=db: raise SystemExit(f'Non-deterministic package: {da} != {db}')
          Path('release/20-sabri-unified-application-shell-1.2.0-PLAN-V4-COMPLETION-RC.sha256').write_text(f'{da}  {a.name}\n',encoding='utf-8')
          print(da)
          PY
          (cd release && sha256sum -c 20-sabri-unified-application-shell-1.2.0-PLAN-V4-COMPLETION-RC.sha256)
          unzip -t release/20-sabri-unified-application-shell-1.2.0-PLAN-V4-COMPLETION-RC.zip
          rm -rf /tmp/file20-v2-clean && mkdir -p /tmp/file20-v2-clean
          unzip -q release/20-sabri-unified-application-shell-1.2.0-PLAN-V4-COMPLETION-RC.zip -d /tmp/file20-v2-clean
          find /tmp/file20-v2-clean/sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          (cd /tmp/file20-v2-clean/sabri-unified-application-shell && sha256sum -c MANIFEST.sha256)

      - name: Commit exact reviewed source
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-unified-application-shell PLAN-V4-COMPLETION-TRACEABILITY.md CENTRAL-PLAN-V4-TRACEABILITY.md STATUS.md
          if git diff --cached --quiet; then
            echo 'sha='$(git rev-parse HEAD) >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m 'Complete File 20 plan-v4 operational scope and adversarial QA'
          git push origin HEAD:codex/file-20-central-plan-v4-1.2.0
          echo 'sha='$(git rev-parse HEAD) >> "$GITHUB_OUTPUT"

      - name: Comment successful evidence on Draft PR #6
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.commit.outputs.sha }}
        run: |
          cat > /tmp/file20-v2-success.md <<EOF
          ## File 20 — plan-v4 operational completion batch

          Repository implementation, review/fix round 1, fresh adversarial review/fix round 2, PHP 7.4/8.3 suites, JavaScript/JSON checks, deterministic double-build and clean-extract verification completed successfully.

          Exact reviewed commit: \`${SHA}\`.

          Newly implemented repository domains: context evidence; contract provenance/health and File 01-B search boundary; settings concurrency; private cache/index controls; File 24 assurance queue; bounded jobs; audit evidence; dry-run repair; compatible rollback.

          This is **repository code/package completion evidence**, not Hostinger staging, live deployment or operational acceptance. Those external gates remain mandatory.
          EOF
          gh pr comment 6 --repo majidhussainqadri1-dot/20-sabri-unified-application-shell --body-file /tmp/file20-v2-success.md

      - uses: actions/upload-artifact@v4
        with:
          name: file20-plan-v4-completion-v2-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.2.0-PLAN-V4-COMPLETION-RC.zip
            release/20-sabri-unified-application-shell-1.2.0-PLAN-V4-COMPLETION-RC.sha256
            PLAN-V4-COMPLETION-TRACEABILITY.md

      - name: Comment failure on Draft PR #6
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment 6 --repo majidhussainqadri1-dot/20-sabri-unified-application-shell --body 'File 20 plan-v4 completion V2 failed a required gate. No completion claim is made; inspect this workflow run, correct the defect, and rerun the full two-round QA.'
