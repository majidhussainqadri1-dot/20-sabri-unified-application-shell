name: Apply File 20 Round Three

on:
  push:
    branches:
      - fix/file20-zero-known-defects-1.1.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file20-zero-known-defects-1.1.2
          fetch-depth: 0
      - name: Apply fresh adversarial correction when pending
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f tools/apply-file20-round3.py; then
            echo 'Round-three source correction is already applied.'
            exit 0
          fi
          python3 tools/apply-file20-round3.py
          python3 - <<'PY'
          from pathlib import Path

          integrations = Path('sabri-unified-application-shell/includes/class-integrations.php')
          text = integrations.read_text(encoding='utf-8')
          old_gate = """\t\tif ( ! empty( $assertions ) ) {
          \t\t\tif ( ! empty( $assertions['_contract_error'] ) || ! empty( $assertions['suspended'] ) || empty( $assertions['approved'] ) || empty( $assertions['eligible'] ) || empty( $assertions['session_two_factor'] ) ) {
          \t\t\t\treturn false;
          \t\t\t}
          """
          new_gate = """\t\tif ( ! empty( $assertions ) ) {
          \t\t\tif ( ! self::assertions_allow_privileged_action( $assertions ) ) {
          \t\t\t\treturn false;
          \t\t\t}
          """
          text = text.replace(old_gate, new_gate)
          integrations.write_text(text, encoding='utf-8')
          if old_gate in integrations.read_text(encoding='utf-8'):
              raise SystemExit('A legacy privileged-action gate remains.')

          tests = Path('sabri-unified-application-shell/tests/run.php')
          test_text = tests.read_text(encoding='utf-8')
          admin_old = """\t'institutional_account' => true,
          \t'approved'           => true,
          \t'eligible'           => true,
          \t'session_two_factor' => true,
          """
          admin_new = """\t'institutional_account' => true,
          \t'approved'           => true,
          \t'eligible'           => true,
          \t'identity_evidence_current' => true,
          \t'two_factor_ready'   => true,
          \t'session_two_factor' => true,
          \t'sensitive_action_ready' => true,
          """
          if admin_new not in test_text:
              if admin_old not in test_text:
                  raise SystemExit('Administrator assertion fixture not found.')
              test_text = test_text.replace(admin_old, admin_new, 1)
              tests.write_text(test_text, encoding='utf-8')
          PY
          rm -f tools/apply-file20-round3.py tools/file20-round3.patch.gz.b64
          rmdir tools 2>/dev/null || true
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          grep -Fq 'assertions_allow_privileged_action' sabri-unified-application-shell/includes/class-integrations.php
          grep -Fq 'array_intersect_key( $filtered, $data )' sabri-unified-application-shell/includes/class-integrations.php
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Round-three correction already present.'
            exit 0
          fi
          git commit -m 'fix: harden File 00 action assurance and public projection allowlist'
          git push origin HEAD:fix/file20-zero-known-defects-1.1.2
