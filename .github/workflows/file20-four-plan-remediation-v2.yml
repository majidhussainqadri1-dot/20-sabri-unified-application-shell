name: File20 Four Plan Remediation V2

on:
  push:
    branches: [codex/file20-four-plan-final-2026-08-07]
    paths: [.github/file20-four-plan-v2.ready]

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic corrections
        run: python .github/scripts/file20-four-plan-remediate.py
      - name: PHP lint
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: find sabri-unified-application-shell/assets/js -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Existing and new tests
        run: |
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-context-navigation.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php
          php sabri-unified-application-shell/tests/run-four-plan-harmonization.php
      - name: Static governance audit
        run: |
          ! grep -R --line-number --include='*.php' --include='*.css' '#ff8a1f' sabri-unified-application-shell/includes sabri-unified-application-shell/assets/css sabri-unified-application-shell/sabri-unified-application-shell.php
          ! grep -R --line-number --include='*.php' -E 'premium[_ -]?only|donor[_ -]?boost|paid[_ -]?ranking' sabri-unified-application-shell/includes
          grep -Fq 'File 25 owns appearance' sabri-unified-application-shell/includes/class-settings.php
          grep -Fq 'search-control-hidden-no-wordpress-fallback' sabri-unified-application-shell/includes/class-four-plan-harmonization.php
      - name: Commit corrected implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat: complete File 20 four-plan harmonization'
          git push origin HEAD:${GITHUB_REF_NAME}
