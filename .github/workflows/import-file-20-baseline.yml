name: File 20 Baseline Archive Integrity

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-baseline-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out exact source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify immutable baseline boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .source-upload
          test -f SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip
          test -f CHECKSUMS.sha256
          test -f sabri-unified-application-shell/sabri-unified-application-shell.php

      - name: Verify exact 1.0.0 baseline archive only
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check CHECKSUMS.sha256
          unzip -t SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip
          rm -rf /tmp/file20-baseline
          mkdir -p /tmp/file20-baseline
          unzip -q SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip -d /tmp/file20-baseline
          test -f /tmp/file20-baseline/sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq '* Version: 1.0.0' /tmp/file20-baseline/sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq "define( 'SABRI_SHELL_VERSION', '1.0.0' );" /tmp/file20-baseline/sabri-unified-application-shell/sabri-unified-application-shell.php

      - name: Confirm editable source is independently versioned
        shell: bash
        run: |
          set -euo pipefail
          main='sabri-unified-application-shell/sabri-unified-application-shell.php'
          readme='sabri-unified-application-shell/readme.txt'
          version="$(sed -n 's/^ \* Version: \([0-9][0-9.]*\)$/\1/p' "$main" | head -n1)"
          constant="$(sed -n "s/^define( 'SABRI_SHELL_VERSION', '\([^']*\)' );$/\1/p" "$main" | head -n1)"
          stable="$(sed -n 's/^Stable tag: \([0-9][0-9.]*\)$/\1/p' "$readme" | head -n1)"
          test -n "$version"
          test "$version" != '1.0.0'
          test "$version" = "$constant"
          test "$version" = "$stable"
          ! diff -qr /tmp/file20-baseline/sabri-unified-application-shell sabri-unified-application-shell >/dev/null
