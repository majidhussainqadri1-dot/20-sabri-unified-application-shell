name: File 20 Baseline Integrity

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-baseline:
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request
        uses: actions/checkout@v4

      - name: Verify repository boundaries
        shell: bash
        run: |
          set -euo pipefail
          test ! -d .source-upload
          test -f SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip
          test -f sabri-unified-application-shell/sabri-unified-application-shell.php

      - name: Verify exact source package
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check CHECKSUMS.sha256
          unzip -t SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip
          rm -rf /tmp/file-20-extracted
          mkdir -p /tmp/file-20-extracted
          unzip -q SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip -d /tmp/file-20-extracted
          diff -qr /tmp/file-20-extracted/sabri-unified-application-shell sabri-unified-application-shell

      - name: Validate PHP and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          php_count="$(find sabri-unified-application-shell -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$php_count" = '16'
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-unified-application-shell/assets/js/shell.js
