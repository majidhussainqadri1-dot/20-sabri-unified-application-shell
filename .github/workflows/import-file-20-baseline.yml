name: Capture File 20 upload payload

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  capture-payload:
    if: github.head_ref == 'baseline/file-20-original-import'
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Combine uploaded package segments
        shell: bash
        run: |
          set -euo pipefail
          cat .source-upload/part-*.b64 > file-20-combined.b64
          wc -c file-20-combined.b64

      - name: Upload combined payload for integrity diagnosis
        uses: actions/upload-artifact@v4
        with:
          name: file-20-combined-b64
          path: file-20-combined.b64
          if-no-files-found: error
          retention-days: 1
