name: Import File 20 baseline

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

jobs:
  import-source:
    if: github.head_ref == 'baseline/file-20-original-import'
    runs-on: ubuntu-latest

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Detect completed exact upload
        id: preflight
        shell: bash
        run: |
          if test -f '.source-upload/EXACT_READY'; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct and verify exact ZIP
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SOURCE-ARCHIVE
          cat .source-upload/exact-*.b64 .source-upload/part-005a.b64 .source-upload/part-005b.b64 .source-upload/part-005c.b64 | base64 --decode > SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip
          sha256sum --check CHECKSUMS.sha256
          unzip -t SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip

      - name: Extract exact plugin source
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sabri-unified-application-shell
          unzip -q SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip
          test -f sabri-unified-application-shell/sabri-unified-application-shell.php

      - name: Validate imported source
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          php_count="$(find sabri-unified-application-shell -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$php_count" = '16'
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-unified-application-shell/assets/js/shell.js

      - name: Commit exact package and extracted source
        if: steps.preflight.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-upload
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'chore: import original File 20 source package'
          git push origin HEAD:${{ github.head_ref }}
