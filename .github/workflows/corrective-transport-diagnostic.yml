name: File 20 Corrective Transport Diagnostic

on:
  pull_request:
    branches:
      - baseline/file-20-original-import

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Decode and inspect transported candidate
        shell: bash
        run: |
          set -u
          wc -c .corrective-upload/part-*.b64
          cat .corrective-upload/part-*.b64 > /tmp/file20-candidate.b64
          wc -c /tmp/file20-candidate.b64
          base64 --decode /tmp/file20-candidate.b64 > /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip
          sha256sum /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip
          unzip -t /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip || true
      - uses: actions/upload-artifact@v4
        with:
          name: file-20-transported-candidate
          path: /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip
          retention-days: 1
