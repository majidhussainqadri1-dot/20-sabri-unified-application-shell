name: File 20 Plan v4 Completion Engineering

on:
  push:
    branches:
      - codex/file-20-central-plan-v4-1.2.0
    paths:
      - .github/workflows/file20-plan-v4-completion.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: file20-plan-v4-completion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  complete-review-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-20-central-plan-v4-1.2.0
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Generate missing plan-v4 operational implementation
        shell: bash
        run: |
          set -euo pipefail
          root='sabri-unified-application-shell'
          mkdir -p "$root/includes" "$root/tests" release

          cat > "$root/includes/class-plan-v4-audit.php" <<'PHP'
          <?php
          /**
           * Bounded, privacy-safe and tamper-evident File 20 operational evidence.
           *
           * @package SabriUnifiedApplicationShell
           */

          namespace Sabri\UnifiedShell;

          if ( ! defined( 'ABSPATH' ) ) {
              exit;
          }

          final class PlanV4Audit {
              const OPTION = 'sabri_shell_plan_v4_audit';
              const LOCK_OPTION = 'sabri_shell_plan_v4_audit_lock';
              const MAX_EVENTS = 500;
              const LOCK_TTL = 30;

              public static function register() {
                  add_filter( 'wp_privacy_personal_data_exporters', array( __CLASS__, 'register_exporter' ) );
                  add_filter( 'wp_privacy_personal_data_erasers', array( __CLASS__, 'register_eraser' ) );
              }

              public static function record( $type, array $context = array() ) {
                  $type = sanitize_key( (string) $type );
                  if ( '' === $type ) {
                      return new \WP_Error( 'sabri_shell_invalid_audit_type', __( 'The audit event type is invalid.', 'sabri-unified-application-shell' ) );
                  }

                  $token = self::acquire_lock();
                  if ( is_wp_error( $token ) ) {
                      return $token;
                  }

                  try {
                      $events = get_option( self::OPTION, array() );
                      $events = is_array( $events ) ? array_values( $events ) : array();
                      $previous_hash = $events ? (string) end( $events )['hash'] : str_repeat( '0', 64 );
                      $payload = array(
                          'event_id' => function_exists( 'wp_generate_uuid4' ) ? wp_generate_uuid4() : uniqid( 'f20-', true ),
                          'type' => $type,
                          'occurred_at' => gmdate( 'c' ),
                          'actor_id' => function_exists( 'get_current_user_id' ) ? absint( get_current_user_id() ) : 0,
                          'correlation_id' => self::correlation_id(),
                          'context' => self::redact( $context ),
                          'previous_hash' => $previous_hash,
                      );
                      $payload['hash'] = hash( 'sha256', $previous_hash . '|' . wp_json_encode( $payload ) );
                      $events[] = $payload;
                      if ( count( $events ) > self::MAX_EVENTS ) {
                          $events = array_slice( $events, -self::MAX_EVENTS );
                      }
                      update_option( self::OPTION, $events, false );
                      do_action( 'sabri_shell_audit_event', $payload );
                      return $payload;
                  } finally {
                      self::release_lock( $token );
                  }
              }

              public static function verify_chain() {
                  $events = get_option( self::OPTION, array() );
                  if ( ! is_array( $events ) ) {
                      return false;
                  }
                  $previous_hash = str_repeat( '0', 64 );
                  foreach ( $events as $event ) {
                      if ( ! is_array( $event ) || ! isset( $event['hash'], $event['previous_hash'] ) || ! hash_equals( $previous_hash, (string) $event['previous_hash'] ) ) {
                          return false;
                      }
                      $copy = $event;
                      $hash = (string) $copy['hash'];
                      unset( $copy['hash'] );
                      $expected = hash( 'sha256', $previous_hash . '|' . wp_json_encode( $copy ) );
                      if ( ! hash_equals( $expected, $hash ) ) {
                          return false;
                      }
                      $previous_hash = $hash;
                  }
                  return true;
              }

              public static function prune() {
                  $events = get_option( self::OPTION, array() );
                  if ( is_array( $events ) && count( $events ) > self::MAX_EVENTS ) {
                      update_option( self::OPTION, array_slice( $events, -self::MAX_EVENTS ), false );
                  }
              }

              public static function register_exporter( $exporters ) {
                  $exporters['sabri-shell-operational-evidence'] = array(
                      'exporter_friendly_name' => __( 'Sabri Shell operational evidence', 'sabri-unified-application-shell' ),
                      'callback' => array( __CLASS__, 'export_personal_data' ),
                  );
                  return $exporters;
              }

              public static function export_personal_data( $email_address, $page = 1 ) {
                  $user = get_user_by( 'email', $email_address );
                  if ( ! $user ) {
                      return array( 'data' => array(), 'done' => true );
                  }
                  $data = array();
                  foreach ( (array) get_option( self::OPTION, array() ) as $event ) {
                      if ( absint( isset( $event['actor_id'] ) ? $event['actor_id'] : 0 ) !== absint( $user->ID ) ) {
                          continue;
                      }
                      $data[] = array(
                          'group_id' => 'sabri-shell-operational-evidence',
                          'group_label' => __( 'Sabri Shell operational evidence', 'sabri-unified-application-shell' ),
                          'item_id' => sanitize_key( (string) $event['event_id'] ),
                          'data' => array(
                              array( 'name' => __( 'Event', 'sabri-unified-application-shell' ), 'value' => sanitize_text_field( (string) $event['type'] ) ),
                              array( 'name' => __( 'Time', 'sabri-unified-application-shell' ), 'value' => sanitize_text_field( (string) $event['occurred_at'] ) ),
                              array( 'name' => __( 'Correlation ID', 'sabri-unified-application-shell' ), 'value' => sanitize_text_field( (string) $event['correlation_id'] ) ),
                          ),
                      );
                  }
                  return array( 'data' => $data, 'done' => true );
              }

              public static function register_eraser( $erasers ) {
                  $erasers['sabri-shell-operational-evidence'] = array(
                      'eraser_friendly_name' => __( 'Sabri Shell operational evidence', 'sabri-unified-application-shell' ),
                      'callback' => array( __CLASS__, 'erase_personal_data' ),
                  );
                  return $erasers;
              }

              public static function erase_personal_data( $email_address, $page = 1 ) {
                  $user = get_user_by( 'email', $email_address );
                  if ( ! $user ) {
                      return array( 'items_removed' => false, 'items_retained' => false, 'messages' => array(), 'done' => true );
                  }
                  $changed = false;
                  $events = (array) get_option( self::OPTION, array() );
                  foreach ( $events as &$event ) {
                      if ( absint( isset( $event['actor_id'] ) ? $event['actor_id'] : 0 ) === absint( $user->ID ) ) {
                          $event['actor_id'] = 0;
                          $event['context'] = array( 'privacy_erased' => true );
                          $changed = true;
                      }
                  }
                  unset( $event );
                  if ( $changed ) {
                      update_option( self::OPTION, $events, false );
                  }
                  return array( 'items_removed' => $changed, 'items_retained' => false, 'messages' => array(), 'done' => true );
              }

              private static function acquire_lock() {
                  $token = function_exists( 'wp_generate_uuid4' ) ? wp_generate_uuid4() : uniqid( 'f20-lock-', true );
                  $record = array( 'token' => $token, 'expires' => time() + self::LOCK_TTL );
                  if ( add_option( self::LOCK_OPTION, $record, '', 'no' ) ) {
                      return $token;
                  }
                  $current = get_option( self::LOCK_OPTION, array() );
                  if ( is_array( $current ) && isset( $current['expires'] ) && absint( $current['expires'] ) < time() ) {
                      delete_option( self::LOCK_OPTION );
                      if ( add_option( self::LOCK_OPTION, $record, '', 'no' ) ) {
                          return $token;
                      }
                  }
                  return new \WP_Error( 'sabri_shell_audit_locked', __( 'Operational evidence is temporarily locked.', 'sabri-unified-application-shell' ) );
              }

              private static function release_lock( $token ) {
                  $current = get_option( self::LOCK_OPTION, array() );
                  if ( is_array( $current ) && isset( $current['token'] ) && hash_equals( (string) $current['token'], (string) $token ) ) {
                      delete_option( self::LOCK_OPTION );
                  }
              }

              private static function correlation_id() {
                  static $id = null;
                  if ( null === $id ) {
                      $id = function_exists( 'wp_generate_uuid4' ) ? wp_generate_uuid4() : uniqid( 'f20-request-', true );
                  }
                  return $id;
              }

              private static function redact( $value, $key = '' ) {
                  if ( preg_match( '/pass|secret|token|cookie|authorization|nonce|key|credential|document|phone|email/i', (string) $key ) ) {
                      return '[redacted]';
                  }
                  if ( is_array( $value ) ) {
                      $clean = array();
                      foreach ( array_slice( $value, 0, 100, true ) as $child_key => $child_value ) {
                          $clean[ sanitize_key( (string) $child_key ) ] = self::redact( $child_value, $child_key );
                      }
                      return $clean;
                  }
                  if ( is_bool( $value ) || is_int( $value ) || is_float( $value ) || null === $value ) {
                      return $value;
                  }
                  return mb_substr( sanitize_text_field( (string) $value ), 0, 500 );
              }
          }

          PlanV4Audit::register();
          PHP

          cat > "$root/includes/class-plan-v4-assurance.php" <<'PHP'
          <?php
          /** File 24 assurance bridge without transferring native enforcement. */
          namespace Sabri\UnifiedShell;
          if ( ! defined( 'ABSPATH' ) ) { exit; }

          final class PlanV4Assurance {
              const OPTION = 'sabri_shell_plan_v4_assurance_queue';
              const MAX_EVENTS = 100;

              public static function register() {
                  add_action( 'sabri_shell_emergency_disabled', array( __CLASS__, 'emergency_disabled' ), 10, 1 );
                  add_action( 'sabri_shell_rollback_failed', array( __CLASS__, 'rollback_failed' ), 10, 1 );
                  add_action( 'sabri_shell_contract_collision', array( __CLASS__, 'contract_collision' ), 10, 1 );
                  add_action( 'sabri_shell_repair_failed', array( __CLASS__, 'repair_failed' ), 10, 1 );
              }

              public static function emergency_disabled( $context = array() ) { self::emit( 'emergency_disable', 'critical', (array) $context ); }
              public static function rollback_failed( $context = array() ) { self::emit( 'rollback_failure', 'critical', (array) $context ); }
              public static function contract_collision( $context = array() ) { self::emit( 'contract_collision', 'high', (array) $context ); }
              public static function repair_failed( $context = array() ) { self::emit( 'repair_failure', 'high', (array) $context ); }

              public static function emit( $type, $severity, array $context = array() ) {
                  $event = array(
                      'schema' => 'sabri-shell-assurance/1.0',
                      'source' => 'file-20',
                      'type' => sanitize_key( $type ),
                      'severity' => in_array( $severity, array( 'critical', 'high', 'medium', 'low', 'info' ), true ) ? $severity : 'info',
                      'occurred_at' => gmdate( 'c' ),
                      'context' => self::sanitize_context( $context ),
                  );
                  PlanV4Audit::record( 'assurance_' . $event['type'], $event );
                  do_action( 'sabri_shell_assurance_event', $event );

                  $delivered = false;
                  if ( function_exists( 'sabri_security_assurance_event' ) ) {
                      try {
                          $delivered = (bool) sabri_security_assurance_event( $event );
                      } catch ( \Throwable $exception ) {
                          $delivered = false;
                      }
                  }
                  if ( ! $delivered ) {
                      $queue = (array) get_option( self::OPTION, array() );
                      $queue[] = $event;
                      update_option( self::OPTION, array_slice( $queue, -self::MAX_EVENTS ), false );
                  }
                  return $delivered;
              }

              public static function flush_queue() {
                  if ( ! function_exists( 'sabri_security_assurance_event' ) ) {
                      return 0;
                  }
                  $remaining = array();
                  $sent = 0;
                  foreach ( array_slice( (array) get_option( self::OPTION, array() ), 0, 25 ) as $event ) {
                      try {
                          if ( sabri_security_assurance_event( $event ) ) {
                              ++$sent;
                              continue;
                          }
                      } catch ( \Throwable $exception ) {
                          // Native shell controls continue; evidence remains queued.
                      }
                      $remaining[] = $event;
                  }
                  $all = (array) get_option( self::OPTION, array() );
                  $tail = array_slice( $all, 25 );
                  update_option( self::OPTION, array_slice( array_merge( $remaining, $tail ), -self::MAX_EVENTS ), false );
                  return $sent;
              }

              private static function sanitize_context( array $context ) {
                  $safe = array();
                  foreach ( array_slice( $context, 0, 30, true ) as $key => $value ) {
                      $key = sanitize_key( (string) $key );
                      if ( preg_match( '/secret|token|nonce|cookie|password|key|document|phone|email/i', $key ) ) {
                          $safe[ $key ] = '[redacted]';
                      } elseif ( is_scalar( $value ) || null === $value ) {
                          $safe[ $key ] = mb_substr( sanitize_text_field( (string) $value ), 0, 300 );
                      }
                  }
                  return $safe;
              }
          }

          PlanV4Assurance::register();
          PHP

          cat > "$root/includes/class-plan-v4-contract-health.php" <<'PHP'
          <?php
          /** Runtime contract provenance, compatibility and failure-state registry. */
          namespace Sabri\UnifiedShell;
          if ( ! defined( 'ABSPATH' ) ) { exit; }

          final class PlanV4ContractHealth {
              const CACHE_KEY = 'sabri_shell_plan_v4_contract_health';
              const CACHE_TTL = 300;

              public static function register() {
                  add_filter( 'sabri_shell_provider_health', array( __CLASS__, 'health' ) );
                  add_filter( 'sabri_shell_search_surface', array( __CLASS__, 'search_surface' ) );
              }

              public static function health( $existing = array(), $force = false ) {
                  if ( ! $force ) {
                      $cached = get_transient( self::CACHE_KEY );
                      if ( is_array( $cached ) ) {
                          return array_merge( (array) $existing, $cached );
                      }
                  }
                  $providers = self::providers();
                  $health = array();
                  foreach ( $providers as $key => $records ) {
                      $records = is_array( $records ) && isset( $records[0] ) && is_array( $records[0] ) ? $records : array( $records );
                      if ( count( $records ) > 1 ) {
                          $health[ $key ] = self::status( $key, 'collision', 'Multiple providers claimed one canonical contract.', $records );
                          do_action( 'sabri_shell_contract_collision', array( 'contract' => $key, 'provider_count' => count( $records ) ) );
                          continue;
                      }
                      $health[ $key ] = self::inspect( $key, reset( $records ) );
                  }
                  set_transient( self::CACHE_KEY, $health, self::CACHE_TTL );
                  return array_merge( (array) $existing, $health );
              }

              public static function invalidate() {
                  delete_transient( self::CACHE_KEY );
              }

              public static function providers() {
                  $providers = array(
                      'file-20-shell' => array(
                          'owner' => 'file-20', 'version' => defined( 'SABRI_SHELL_VERSION' ) ? SABRI_SHELL_VERSION : '0.0.0',
                          'minimum' => '1.2.0', 'probe' => array( __CLASS__, 'probe_file20' ), 'failure' => 'incompatible',
                      ),
                      'file-00-identity' => array(
                          'owner' => 'file-00', 'version' => defined( 'SMC_VERSION' ) ? SMC_VERSION : '0.0.0',
                          'minimum' => '1.1.2', 'probe' => array( __CLASS__, 'probe_file00' ), 'failure' => 'privileged_actions_closed',
                      ),
                      'file-22-create' => array(
                          'owner' => 'file-20', 'version' => defined( 'SABRI_SHELL_CREATE_CONTRACT_VERSION' ) ? SABRI_SHELL_CREATE_CONTRACT_VERSION : '0.0.0',
                          'minimum' => '1.0.1', 'probe' => array( __CLASS__, 'probe_file22' ), 'failure' => 'create_hidden',
                      ),
                      'file-25-visual' => array(
                          'owner' => 'file-25', 'version' => '0.0.0', 'minimum' => '1.0.0',
                          'probe' => array( __CLASS__, 'probe_file25' ), 'failure' => 'continuity_fallback',
                      ),
                      'file-01b-registry-search' => array(
                          'owner' => 'file-01-b', 'version' => '0.0.0', 'minimum' => '1.0.0',
                          'probe' => array( __CLASS__, 'probe_file01b' ), 'failure' => 'bounded_local_registry_only',
                      ),
                  );
                  return apply_filters( 'sabri_shell_provider_registry', $providers );
              }

              public static function search_surface( $surface = array() ) {
                  $provider = apply_filters( 'sabri_platform_search_surface_provider', null );
                  if ( is_array( $provider ) && ! empty( $provider['url'] ) && ! empty( $provider['owner'] ) ) {
                      return array(
                          'owner' => sanitize_key( $provider['owner'] ),
                          'url' => esc_url_raw( $provider['url'] ),
                          'status' => 'available',
                          'scope' => isset( $provider['scope'] ) ? sanitize_key( $provider['scope'] ) : 'platform',
                      );
                  }
                  return array(
                      'owner' => 'wordpress-core',
                      'url' => home_url( '/' ),
                      'status' => 'bounded_fallback',
                      'scope' => 'local_public_content',
                  );
              }

              public static function probe_file20() { return class_exists( __NAMESPACE__ . '\\Layout', false ); }
              public static function probe_file00() { return class_exists( 'SMC_Contracts' ) && is_callable( array( 'SMC_Contracts', 'assertions' ) ); }
              public static function probe_file22() { return function_exists( 'sabri_shell_create_visible_for_current_user' ) && function_exists( 'sabri_shell_create_url' ); }
              public static function probe_file25() {
                  $contract = apply_filters( 'sabri_shell_file25_visual_contract', null );
                  return is_array( $contract ) && isset( $contract['owner'], $contract['version'] ) && 'file-25' === sanitize_key( $contract['owner'] );
              }
              public static function probe_file01b() {
                  $manifest = apply_filters( 'sabri_platform_foundation_manifest', null );
                  return is_array( $manifest ) && isset( $manifest['owner'], $manifest['version'] ) && 'file-01-b' === sanitize_key( $manifest['owner'] );
              }

              private static function inspect( $key, $record ) {
                  if ( ! is_array( $record ) || empty( $record['owner'] ) || empty( $record['minimum'] ) || empty( $record['probe'] ) ) {
                      return self::status( $key, 'invalid', 'Provider record is incomplete.', $record );
                  }
                  $available = false;
                  try {
                      $available = is_callable( $record['probe'] ) && (bool) call_user_func( $record['probe'] );
                  } catch ( \Throwable $exception ) {
                      return self::status( $key, 'error', 'Provider probe threw an exception.', $record );
                  }
                  if ( ! $available ) {
                      return self::status( $key, 'unavailable', isset( $record['failure'] ) ? $record['failure'] : 'unavailable', $record );
                  }
                  $version = isset( $record['version'] ) ? (string) $record['version'] : '0.0.0';
                  if ( '0.0.0' !== $version && version_compare( $version, (string) $record['minimum'], '<' ) ) {
                      return self::status( $key, 'incompatible', 'Provider version is below the declared minimum.', $record );
                  }
                  return self::status( $key, 'healthy', 'Provider provenance and probe passed.', $record );
              }

              private static function status( $key, $state, $message, $record ) {
                  return array(
                      'contract' => sanitize_key( $key ),
                      'state' => sanitize_key( $state ),
                      'owner' => is_array( $record ) && isset( $record['owner'] ) ? sanitize_key( $record['owner'] ) : 'unknown',
                      'version' => is_array( $record ) && isset( $record['version'] ) ? sanitize_text_field( (string) $record['version'] ) : 'unknown',
                      'checked_at' => gmdate( 'c' ),
                      'message' => sanitize_text_field( $message ),
                  );
              }
          }

          PlanV4ContractHealth::register();
          PHP

          cat > "$root/includes/class-plan-v4-context.php" <<'PHP'
          <?php
          /** Deterministic layout context evidence: mode, reason, source, route and timestamp. */
          namespace Sabri\UnifiedShell;
          if ( ! defined( 'ABSPATH' ) ) { exit; }

          final class PlanV4Context {
              public static function register() {
                  add_filter( 'body_class', array( __CLASS__, 'body_classes' ) );
                  add_action( 'rest_api_init', array( __CLASS__, 'register_routes' ) );
              }

              public static function describe() {
                  $settings = class_exists( __NAMESPACE__ . '\\Settings', false ) ? Settings::get() : array();
                  $page_id = class_exists( __NAMESPACE__ . '\\Layout', false ) ? Layout::current_page_id() : 0;
                  $mode = class_exists( __NAMESPACE__ . '\\Layout', false ) ? Layout::current_mode() : 'minimal';
                  $reason = 'default_public_safe';
                  $source = 'file-20-resolver';

                  if ( class_exists( __NAMESPACE__ . '\\SafeMode', false ) && SafeMode::disabled() ) {
                      $reason = 'safe_mode';
                  } elseif ( class_exists( __NAMESPACE__ . '\\Layout', false ) && Layout::is_excluded_request() ) {
                      $reason = 'task_or_machine_request';
                  } elseif ( $page_id && isset( $settings['layout']['per_page_overrides'][ $page_id ] ) && 'default' !== $settings['layout']['per_page_overrides'][ $page_id ] ) {
                      $reason = 'validated_page_override';
                  } elseif ( class_exists( __NAMESPACE__ . '\\Layout', false ) && Layout::is_immersive_context( $settings, $page_id ) ) {
                      $reason = 'native_immersive_context';
                  } elseif ( class_exists( __NAMESPACE__ . '\\Layout', false ) && Layout::is_three_column_context( $settings, $page_id ) ) {
                      $reason = 'canonical_three_column_context';
                  }

                  $path = isset( $_SERVER['REQUEST_URI'] ) ? (string) wp_parse_url( wp_unslash( $_SERVER['REQUEST_URI'] ), PHP_URL_PATH ) : '/';
                  $route_key = apply_filters( 'sabri_shell_current_route_key', '' );
                  if ( ! is_string( $route_key ) || '' === $route_key ) {
                      $segments = array_values( array_filter( explode( '/', trim( strtolower( $path ), '/' ) ) ) );
                      $route_key = $segments ? sanitize_key( reset( $segments ) ) : 'home';
                  }

                  $descriptor = array(
                      'schema' => 'sabri-shell-context/1.0',
                      'mode' => sanitize_key( $mode ),
                      'reason' => sanitize_key( $reason ),
                      'source' => sanitize_key( $source ),
                      'route_key' => sanitize_key( $route_key ),
                      'page_id' => absint( $page_id ),
                      'resolved_at' => gmdate( 'c' ),
                  );
                  return apply_filters( 'sabri_shell_context_descriptor', $descriptor );
              }

              public static function body_classes( $classes ) {
                  $descriptor = self::describe();
                  $classes[] = 'sabri-shell-route-' . sanitize_html_class( $descriptor['route_key'] );
                  $classes[] = 'sabri-shell-context-evidenced';
                  return array_values( array_unique( $classes ) );
              }

              public static function register_routes() {
                  register_rest_route( 'sabri-shell/v1', '/context', array(
                      'methods' => \WP_REST_Server::READABLE,
                      'callback' => array( __CLASS__, 'rest_context' ),
                      'permission_callback' => '__return_true',
                  ) );
              }

              public static function rest_context() {
                  $descriptor = self::describe();
                  unset( $descriptor['page_id'] );
                  return rest_ensure_response( $descriptor );
              }
          }

          PlanV4Context::register();
          PHP

          cat > "$root/includes/class-plan-v4-settings-concurrency.php" <<'PHP'
          <?php
          /** Optimistic concurrency control for File 20 settings. */
          namespace Sabri\UnifiedShell;
          if ( ! defined( 'ABSPATH' ) ) { exit; }

          final class PlanV4SettingsConcurrency {
              const VERSION_OPTION = 'sabri_shell_settings_row_version';
              private static $accepted_update = false;

              public static function register() {
                  foreach ( array( 'sabri_shell_settings', 'sabri_unified_shell_settings' ) as $option ) {
                      add_filter( 'pre_update_option_' . $option, array( __CLASS__, 'pre_update' ), 10, 3 );
                  }
                  add_action( 'updated_option', array( __CLASS__, 'after_update' ), 10, 3 );
                  add_action( 'admin_footer', array( __CLASS__, 'inject_version_field' ) );
