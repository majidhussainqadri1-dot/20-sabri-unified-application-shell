name: File 20 and File 25 V12.3 Exact Source Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "sabri-unified-application-shell/includes/class-welcome-experience.php"
      - "sabri-unified-application-shell/includes/class-four-plan-harmonization.php"
      - "sabri-unified-application-shell/tests/v123-companion-integration.php"
      - ".github/workflows/welcome-companion-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-companion:
    name: WordPress-stub integration with genuine pinned File 25 source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact File 20 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: file20
      - name: Checkout File 25 PR 51 exact compatible source
        uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/25-sabri-public-ui-profile-timeline-visual-experience
          ref: e48f9195d50f07cd52501e023fd729f84ca91e40
          path: file25
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Parse real companion source and run inter-repository contract
        run: |
          php -l file20/sabri-unified-application-shell/tests/v123-companion-integration.php
          php file20/sabri-unified-application-shell/tests/v123-companion-integration.php "${GITHUB_WORKSPACE}/file25"
      - name: State evidence boundary
        run: |
          echo "These checks execute source on a WordPress stub, not an installed WordPress site."
          echo "No stage/live deployment, DB migration, visual browser or parity claim."
