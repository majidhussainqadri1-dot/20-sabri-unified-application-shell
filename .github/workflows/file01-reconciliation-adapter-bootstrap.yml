name: Temporary File 20 File01 Reconciliation Adapter Bootstrap

on:
  push:
    branches:
      - fix/file01-reconciliation-adapter

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', '[file01-adapter-patched]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Apply isolated File 20 owner adapter and regression
        shell: bash
        run: |
          set -euo pipefail
          cat > sabri-unified-application-shell/includes/class-file01-reconciliation-adapter.php <<'PHP'
          <?php
          /**
           * File 20 canonical shell-route acknowledgement for File 01 legacy cutover.
           *
           * File 20 acknowledges only route/navigation handoff. It never mutates File 01
           * options/pages and never claims native content ownership. Home/News content
           * acknowledgement belongs to File 21.
           *
           * @package SabriUnifiedApplicationShell
           */
          namespace Sabri\UnifiedShell;
          if ( ! defined( 'ABSPATH' ) ) { exit; }

          final class File01ReconciliationAdapter {
              const CONTRACT_VERSION = '1.0.0';
              const RECEIPTS_OPTION  = 'sabri_shell_file01_reconciliation_receipts';

              private static function keys() {
                  return array( 'founder', 'learn', 'encyclopedia', 'doctors', 'clinic', 'video_wall', 'reels', 'pdf_library', 'radar', 'ai', 'network', 'marketplace' );
              }

              public static function register() {
                  add_filter( 'spf_owner_reconciliation_plan', array( __CLASS__, 'plan' ), 20, 2 );
                  add_filter( 'spf_execute_owner_reconciliation', array( __CLASS__, 'execute' ), 20, 3 );
                  add_filter( 'spf_rollback_owner_reconciliation', array( __CLASS__, 'rollback' ), 20, 3 );
              }

              public static function plan( $plan, $context ) {
                  if ( is_array( $plan ) ) { return $plan; }
                  $context = is_array( $context ) ? $context : array();
                  $key = sanitize_key( isset( $context['legacy_key'] ) ? $context['legacy_key'] : '' );
                  if ( ! in_array( $key, self::keys(), true ) ) { return $plan; }
                  $destinations = Defaults::destinations();
                  if ( empty( $destinations[ $key ] ) || ! is_array( $destinations[ $key ] ) ) { return $plan; }
                  return array(
                      'accepted'        => true,
                      'owner_module'    => 'file-20',
                      'command_version' => self::CONTRACT_VERSION,
                      'owner_scope'     => 'shell_route_navigation_handoff',
                      'legacy_key'      => $key,
                      'page_id'         => absint( isset( $context['page_id'] ) ? $context['page_id'] : 0 ),
                      'content_owner'   => 'native-domain-owner',
                      'reversible'      => true,
                  );
              }

              public static function execute( $result, $action, $plan_hash ) {
                  if ( is_array( $result ) ) { return $result; }
                  if ( ! is_array( $action ) || ! is_array( isset( $action['owner_plan'] ) ? $action['owner_plan'] : null ) ) { return $result; }
                  $owner_plan = $action['owner_plan'];
                  if ( 'file-20' !== sanitize_key( isset( $owner_plan['owner_module'] ) ? $owner_plan['owner_module'] : '' ) ) { return $result; }
                  if ( self::CONTRACT_VERSION !== (string) ( isset( $owner_plan['command_version'] ) ? $owner_plan['command_version'] : '' ) ) { return $result; }
                  $key = sanitize_key( isset( $action['legacy_key'] ) ? $action['legacy_key'] : '' );
                  if ( ! in_array( $key, self::keys(), true ) ) { return $result; }
                  $page_id = absint( isset( $action['page_id'] ) ? $action['page_id'] : 0 );
                  $plan_hash = strtolower( preg_replace( '/[^a-f0-9]/i', '', (string) $plan_hash ) );
                  if ( 64 !== strlen( $plan_hash ) ) { return $result; }
                  $receipt_id = 'file20-' . substr( hash( 'sha256', $plan_hash . '|' . $key . '|' . $page_id . '|' . self::CONTRACT_VERSION ), 0, 40 );
                  $state = array(
                      'receipt_id'      => $receipt_id,
                      'legacy_key'      => $key,
                      'page_id'         => $page_id,
                      'plan_hash'       => $plan_hash,
                      'command_version' => self::CONTRACT_VERSION,
                      'scope'           => 'shell_route_navigation_handoff',
                  );
                  $state_hash = hash( 'sha256', self::json( $state ) );
                  $all = get_option( self::RECEIPTS_OPTION, array() );
                  $all = is_array( $all ) ? $all : array();
                  if ( isset( $all[ $receipt_id ] ) && self::json( $all[ $receipt_id ] ) !== self::json( $state ) ) { return $result; }
                  $all[ $receipt_id ] = $state;
                  update_option( self::RECEIPTS_OPTION, $all, false );
                  $saved = get_option( self::RECEIPTS_OPTION, array() );
                  if ( ! is_array( $saved ) || ! isset( $saved[ $receipt_id ] ) || self::json( $saved[ $receipt_id ] ) !== self::json( $state ) ) { return $result; }
                  return array(
                      'success'          => true,
                      'receipt_id'       => $receipt_id,
                      'owner_module'     => 'file-20',
                      'command_version'  => self::CONTRACT_VERSION,
                      'rollback_command' => 'rollback_file01_shell_route_ack',
                      'state_hash'       => $state_hash,
                  );
              }

              public static function rollback( $result, $receipt, $plan_hash ) {
                  if ( is_array( $result ) && ! empty( $result['success'] ) ) { return $result; }
                  if ( ! is_array( $receipt ) || 'file-20' !== sanitize_key( isset( $receipt['owner_module'] ) ? $receipt['owner_module'] : '' ) ) { return $result; }
                  if ( 'rollback_file01_shell_route_ack' !== sanitize_key( isset( $receipt['rollback_command'] ) ? $receipt['rollback_command'] : '' ) ) { return $result; }
                  $receipt_id = sanitize_key( isset( $receipt['receipt_id'] ) ? $receipt['receipt_id'] : '' );
                  $all = get_option( self::RECEIPTS_OPTION, array() );
                  $all = is_array( $all ) ? $all : array();
                  if ( ! isset( $all[ $receipt_id ] ) ) { return array( 'success' => true, 'idempotent_replay' => true ); }
                  $stored = $all[ $receipt_id ];
                  $expected_hash = strtolower( preg_replace( '/[^a-f0-9]/i', '', (string) $plan_hash ) );
                  if ( ! is_array( $stored ) || ! hash_equals( (string) $stored['plan_hash'], $expected_hash ) ) { return $result; }
                  unset( $all[ $receipt_id ] );
                  update_option( self::RECEIPTS_OPTION, $all, false );
                  $saved = get_option( self::RECEIPTS_OPTION, array() );
                  if ( is_array( $saved ) && isset( $saved[ $receipt_id ] ) ) { return $result; }
                  return array( 'success' => true, 'receipt_id' => $receipt_id );
              }

              private static function json( $value ) {
                  return function_exists( 'wp_json_encode' ) ? (string) wp_json_encode( $value ) : (string) json_encode( $value );
              }
          }
          PHP

          python3 - <<'PY'
          from pathlib import Path
          p=Path('sabri-unified-application-shell/sabri-unified-application-shell.php')
          s=p.read_text()
          needle='    Sabri\\UnifiedShell\\FourPlanHarmonization::register();\n'
          repl=needle+'    Sabri\\UnifiedShell\\File01ReconciliationAdapter::register();\n'
          if repl not in s:
              if needle not in s: raise SystemExit('File 20 registration anchor missing')
              s=s.replace(needle,repl,1)
          p.write_text(s)
          PY

          cat > sabri-unified-application-shell/tests/run-file01-reconciliation-adapter.php <<'PHP'
          <?php
          define( 'ABSPATH', __DIR__ );
          $GLOBALS['f20_options'] = array();
          function __( $text ) { return $text; }
          function add_filter() { return true; }
          function sanitize_key( $value ) { return preg_replace( '/[^a-z0-9_\-]/', '', strtolower( (string) $value ) ); }
          function absint( $value ) { return abs( (int) $value ); }
          function get_option( $key, $default = false ) { return array_key_exists( $key, $GLOBALS['f20_options'] ) ? $GLOBALS['f20_options'][ $key ] : $default; }
          function update_option( $key, $value ) { $GLOBALS['f20_options'][ $key ] = $value; return true; }
          function wp_json_encode( $value ) { return json_encode( $value ); }
          require dirname( __DIR__ ) . '/includes/class-defaults.php';
          require dirname( __DIR__ ) . '/includes/class-file01-reconciliation-adapter.php';
          use Sabri\UnifiedShell\File01ReconciliationAdapter;
          $n=0;
          $ok=function($c,$m)use(&$n){$n++;if(!$c){fwrite(STDERR,"FAIL: $m\n");exit(1);}};
          $plan=File01ReconciliationAdapter::plan(null,array('legacy_key'=>'founder','page_id'=>164));
          $ok(is_array($plan)&&true===$plan['accepted'],'Founder shell route is acknowledged.');
          $ok('file-20'===$plan['owner_module'],'File 20 owns shell route acknowledgement.');
          $ok(null===File01ReconciliationAdapter::plan(null,array('legacy_key'=>'home','page_id'=>162)),'Home content is left to File 21.');
          $ok(null===File01ReconciliationAdapter::plan(null,array('legacy_key'=>'news','page_id'=>163)),'News content is left to File 21.');
          $hash=str_repeat('a',64);
          $action=array('legacy_key'=>'founder','page_id'=>164,'owner_plan'=>$plan);
          $receipt=File01ReconciliationAdapter::execute(null,$action,$hash);
          $ok(is_array($receipt)&&true===$receipt['success'],'Execution returns a success receipt.');
          $ok('file-20'===$receipt['owner_module'],'Receipt is owner-bound.');
          $ok(64===strlen($receipt['state_hash']),'Receipt has a bounded state hash.');
          $again=File01ReconciliationAdapter::execute(null,$action,$hash);
          $ok($again['receipt_id']===$receipt['receipt_id'],'Execution is idempotent.');
          $rolled=File01ReconciliationAdapter::rollback(null,$receipt,$hash);
          $ok(is_array($rolled)&&true===$rolled['success'],'Rollback succeeds.');
          $replay=File01ReconciliationAdapter::rollback(null,$receipt,$hash);
          $ok(is_array($replay)&&true===$replay['success']&&!empty($replay['idempotent_replay']),'Rollback is idempotent.');
          echo "File 20 File01 reconciliation adapter assertions {$n}/{$n} PASS\n";
          PHP

          rm .github/workflows/file01-reconciliation-adapter-bootstrap.yml
          php -l sabri-unified-application-shell/includes/class-file01-reconciliation-adapter.php
          php -l sabri-unified-application-shell/tests/run-file01-reconciliation-adapter.php
          php sabri-unified-application-shell/tests/run-file01-reconciliation-adapter.php
          git diff --check
      - name: Commit isolated adapter
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'majidhussainqadri1-dot'
          git config user.email 'majidhussainqadri1@gmail.com'
          git add -A
          git commit -m 'fix: add File 20 canonical File 01 reconciliation adapter [file01-adapter-patched]'
          git push origin HEAD:fix/file01-reconciliation-adapter
