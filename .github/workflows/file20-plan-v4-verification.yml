name: File 20 Plan v4 Independent Verification

on:
  push:
    branches:
      - codex/file-20-central-plan-v4-1.2.0
    paths:
      - .github/workflows/file20-plan-v4-verification.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/file-20-central-plan-v4-1.2.0
          fetch-depth: 0

      - name: Verify completion files exist
        run: |
          set -euo pipefail
          test -f PLAN-V4-COMPLETION-TRACEABILITY.md
          for file in audit assurance contract-health context settings-concurrency privacy-cache jobs recovery; do
            test -f "sabri-unified-application-shell/includes/class-plan-v4-${file}.php"
          done
          test -f sabri-unified-application-shell/tests/run-plan-v4-completion.php
          test -f sabri-unified-application-shell/tests/run-plan-v4-adversarial.php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          coverage: none

      - name: PHP 7.4 full repository QA
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: PHP 8.3 full repository QA
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php
          node --check sabri-unified-application-shell/assets/js/shell.js
          node --check sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null

      - name: Deterministic package proof
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil
          root=Path('sabri-unified-application-shell')
          def build(target):
              stage=Path('/tmp')/('verify-'+target.stem)/root.name
              shutil.rmtree(stage.parent,ignore_errors=True)
              shutil.copytree(root,stage)
              files=sorted(p for p in stage.rglob('*') if p.is_file() and p.name!='MANIFEST.sha256')
              manifest=[f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(stage).as_posix()}" for p in files]
              (stage/'MANIFEST.sha256').write_text('\n'.join(manifest)+'\n',encoding='utf-8')
              with ZipFile(target,'w') as zf:
                  for p in sorted(stage.rglob('*')):
                      if p.is_file():
                          info=ZipInfo((Path(root.name)/p.relative_to(stage)).as_posix(),(2026,8,2,5,0,0))
                          info.compress_type=ZIP_DEFLATED
                          info.external_attr=(0o100644 & 0xFFFF)<<16
                          zf.writestr(info,p.read_bytes())
              return hashlib.sha256(target.read_bytes()).hexdigest()
          a=Path('/tmp/file20-a.zip'); b=Path('/tmp/file20-b.zip')
          da=build(a); db=build(b)
          assert da==db, (da,db)
          print(da)
          PY

      - name: Publish verification result to Draft PR #6
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        run: |
          cat > /tmp/file20-verification.md <<EOF
          ## File 20 — independent plan-v4 completion verification

          **Workflow result:** ${RESULT}

          Verification scope:
          - generated operational-completion classes and bootstrap presence;
          - PHP 7.4 and PHP 8.3 syntax;
          - all previous regression suites;
          - separate plan-v4 completion suite;
          - fresh adversarial suite;
          - JavaScript and JSON validation;
          - deterministic double-build proof.

          This verification concerns repository source/package scope only. Hostinger staging, real File 00–25 integrations, browser/accessibility evidence, backup/restore, rollback rehearsal, Founder acceptance and live operations remain separate gates.
          EOF
          gh pr comment 6 --repo majidhussainqadri1-dot/20-sabri-unified-application-shell --body-file /tmp/file20-verification.md
