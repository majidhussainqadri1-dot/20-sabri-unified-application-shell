name: File 20 Round 80 Executor Repair

on:
  push:
    branches: [audit/file20-eighty-round-2026-08-09]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - name: Repair validation assertions in the one-time Round 80 executor
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/round80-corrective-fix.yml')
          s=p.read_text(encoding='utf-8')
          old=s
          s=s.replace(
              "false !== strpos( $integrations, \\\"'status' => $scan_complete ? 'none' : 'incomplete'\\\" )",
              "false !== strpos( $integrations, \\\"'status' =>\\\" ) && false !== strpos( $integrations, \\\"'incomplete'\\\" )"
          )
          s=s.replace(
              "$assert(false !== strpos($route, 'rawurldecode') && false !== strpos($route, \\\"strpos( $decoded, '\\\\\\\\' )\\\"), 'encoded backslash ambiguity rejected after decoding');",
              "$assert(false !== strpos($route, 'rawurldecode') && substr_count($route, \\\"'\\\\\\\\'\\\") >= 2, 'encoded backslash ambiguity rejected after decoding');"
          )
          marker="          rep('tests/bootstrap.php',\n              \"require_once dirname( __DIR__ ) . '/includes/class-home-feed.php';\\n\",\n              \"\", 1)\n"
          insert=marker+"          rep('tests/bootstrap.php',\n              \"function wp_http_validate_url( $value ) { return (bool) filter_var( $value, FILTER_VALIDATE_URL ); }\",\n              \"function wp_http_validate_url( $value ) { return (bool) filter_var( $value, FILTER_VALIDATE_URL ); }\\nfunction wp_validate_redirect( $location, $fallback = '' ) { return is_string( $location ) && '' !== $location ? $location : $fallback; }\", 1)\n"
          if marker in s and 'function wp_validate_redirect' not in s:
              s=s.replace(marker,insert,1)
          if s==old:
              print('executor already repaired; no change')
          else:
              p.write_text(s,encoding='utf-8')
              print('executor repaired')
          PY
          if git diff --quiet -- .github/workflows/round80-corrective-fix.yml; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/round80-corrective-fix.yml
          git commit -m 'File 20 round 80: repair corrective executor [executor-repaired]'
          git push origin HEAD:audit/file20-eighty-round-2026-08-09
