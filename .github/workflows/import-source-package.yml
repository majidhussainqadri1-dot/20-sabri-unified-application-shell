name: Import and verify original source package

on:
  push:
    branches:
      - baseline/file-20-original-import
    paths:
      - '.source-upload/**'
      - '.github/workflows/import-source-package.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest

    steps:
      - name: Check out baseline branch
        uses: actions/checkout@v4
        with:
          ref: baseline/file-20-original-import
          fetch-depth: 0

      - name: Reconstruct and verify exact ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p SOURCE-ARCHIVE
          cat .source-upload/part-*.b64 | base64 --decode > SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip
          sha256sum --check CHECKSUMS.sha256
          unzip -t SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip

      - name: Extract exact plugin source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sabri-unified-application-shell
          unzip -q SOURCE-ARCHIVE/20-sabri-unified-application-shell-1.0.0-FINAL.zip
          test -f sabri-unified-application-shell/sabri-unified-application-shell.php

      - name: Validate imported source
        shell: bash
        run: |
          set -euo pipefail
          php_count="$(find sabri-unified-application-shell -type f -name '*.php' | wc -l | tr -d ' ')"
          test "$php_count" = "16"
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-unified-application-shell/assets/js/shell.js

      - name: Commit exact package and extracted source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .source-upload
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "No source changes to commit."
            exit 0
          fi
          git commit -m "chore: import original File 20 source package"
          git push origin HEAD:baseline/file-20-original-import
