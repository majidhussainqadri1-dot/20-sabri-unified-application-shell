name: Apply File 20 1.1.2 Correction

on:
  push:
    branches:
      - fix/file20-zero-known-defects-1.1.2
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/file20-zero-known-defects-1.1.2
          fetch-depth: 0

      - name: Apply reviewed corrective patch when pending
        shell: bash
        run: |
          set -euo pipefail
          if test ! -f .file20-correction/READY; then
            echo 'File 20 corrective patch is already applied.'
            exit 0
          fi
          base64 --decode tools/file20-1.1.2.patch.gz.b64 | gzip -dc > /tmp/file20-1.1.2.patch
          git apply --check /tmp/file20-1.1.2.patch
          git apply /tmp/file20-1.1.2.patch
          rm -f .file20-correction/READY tools/file20-1.1.2.patch.gz.b64
          rmdir .file20-correction tools 2>/dev/null || true

          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-unified-application-shell/assets/js/shell.js
          node --check sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          ! grep -R "'posts_per_page'[[:space:]]*=>[[:space:]]*-1" sabri-unified-application-shell/includes
          grep -Fq "if ( ! \$base_allowed )" sabri-unified-application-shell/includes/class-create-contract.php
          grep -Fq "sabri_shell_create_visible_for_current_user()" sabri-unified-application-shell/includes/class-renderer.php

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: close File 20 authorization privacy and bounded-query defects'
          git push origin HEAD:fix/file20-zero-known-defects-1.1.2
