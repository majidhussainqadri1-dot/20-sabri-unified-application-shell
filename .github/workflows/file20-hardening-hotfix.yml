name: File 20 Authority Hardening Hotfix

on:
  pull_request:
    branches:
      - main
      - baseline/file-20-original-import

permissions:
  contents: write

jobs:
  harden-repack:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Detect hardening request
        id: detect
        shell: bash
        run: |
          if test -f '.corrective-repack/READY' && test -f 'tools/file20-hardening.py'; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Correct runner replacement semantics
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tools/file20-hardening.py')
          text = path.read_text(encoding='utf-8')
          old = 'pattern.subn(new_authority_section, integrations, count=1)'
          new = 'pattern.subn(lambda _match: new_authority_section, integrations, count=1)'
          if text.count(old) != 1:
              raise SystemExit('Expected hardening substitution call was not found exactly once.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Apply second-round correction
        if: steps.detect.outputs.pending == 'true'
        run: python3 tools/file20-hardening.py
      - name: Validate corrected source
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-unified-application-shell/assets/js/shell.js
          php sabri-unified-application-shell/tests/run.php
          python3 - <<'PY'
          from pathlib import Path
          php = '\n'.join(p.read_text(encoding='utf-8') for p in Path('sabri-unified-application-shell').rglob('*.php'))
          for forbidden in ('smc_professional_credentials', 'smc_clinics'):
              if forbidden in php:
                  raise SystemExit(f'Non-owned direct table query remains: {forbidden}')
          for required in ('SMC_Contracts', 'SPD_Verification_Adapter', 'SPD_Helpers::can_show_contact'):
              if required not in php:
                  raise SystemExit(f'Missing authoritative contract: {required}')
          print('Authority/privacy assertions passed.')
          PY
      - name: Build deterministic corrected candidate
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          root = Path('sabri-unified-application-shell')
          out = Path('RELEASES/20-sabri-unified-application-shell-1.1.0-RC1.zip')
          out.parent.mkdir(parents=True, exist_ok=True)
          if out.exists():
              out.unlink()
          with ZipFile(out, 'w') as archive:
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  info = ZipInfo(path.as_posix(), (2026, 8, 1, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  archive.writestr(info, path.read_bytes())
          PY
          sha="$(sha256sum RELEASES/20-sabri-unified-application-shell-1.1.0-RC1.zip | awk '{print $1}')"
          printf '%s  %s\n' "$sha" '20-sabri-unified-application-shell-1.1.0-RC1.zip' > RELEASES/CHECKSUMS.sha256
          cat > RELEASES/README.md <<DOC
          # File 20 Corrective Candidate

          - Package: \`20-sabri-unified-application-shell-1.1.0-RC1.zip\`
          - Plugin version: \`1.1.0\`
          - SHA-256: \`$sha\`
          - Status: corrected release candidate; automated QA accepted, staging not yet accepted
          - Corrections: authoritative File 00 publishing assertions, File 03 verified/public profile projection, explicit public-contact consent, and removal of direct queries to non-owned Membership Core tables.

          The exact original 1.0.0 baseline remains unchanged in \`SOURCE-ARCHIVE/\`. Hostinger staging and live deployment remain separate lifecycle gates.
          DOC
          rm -rf .corrective-repack
          rm -f tools/file20-hardening.py
      - name: Verify package/source equality
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          (cd RELEASES && sha256sum --check CHECKSUMS.sha256)
          unzip -t RELEASES/20-sabri-unified-application-shell-1.1.0-RC1.zip
          rm -rf /tmp/file20-candidate
          mkdir -p /tmp/file20-candidate
          unzip -q RELEASES/20-sabri-unified-application-shell-1.1.0-RC1.zip -d /tmp/file20-candidate
          diff -qr /tmp/file20-candidate/sabri-unified-application-shell sabri-unified-application-shell
      - name: Commit corrected source and package
        if: steps.detect.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: enforce File 00 and File 03 authority boundaries'
          git push origin HEAD:${{ github.head_ref }}
