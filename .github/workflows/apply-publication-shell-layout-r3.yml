name: Apply File 20 publication shell layout correction R3

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  correct-review-commit:
    if: github.head_ref == 'fix/file20-publication-shell-layout-1.2.1'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact correction branch
        uses: actions/checkout@v4
        with:
          ref: fix/file20-publication-shell-layout-1.2.1
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Apply bounded shell correction
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          root = Path('sabri-unified-application-shell')

          js = r'''(function () {
          	'use strict';

          	var repaired = false;
          	var observer = null;
          	var selectors = 'main.site-main, main#main, .site-main, #primary, .content-area, main, #content, .site-content';

          	function isPublicationRequest() {
          		return document.body.classList.contains('sabri-hnf-managed-single') ||
          			document.body.classList.contains('sabri-hnf-content-integrity-single');
          	}

          	function desktopSidebar(selector) {
          		return document.querySelector(selector + ':not(.sabri-shell-left-sidebar-drawer):not(.sabri-shell-right-sidebar-drawer)');
          	}

          	function safeTarget(element) {
          		if (!element || element === document.body || element === document.documentElement) {
          			return false;
          		}
          		if (
          			element.matches('.wp-site-blocks, #page, .site, [data-sabri-shell-component]') ||
          			element.closest('[data-sabri-shell-component]') ||
          			element.querySelector('[data-sabri-shell-component]')
          		) {
          			return false;
          		}
          		return true;
          	}

          	function findPublicationTarget() {
          		if (!isPublicationRequest()) {
          			return null;
          		}
          		var publication = document.querySelector('.sabri-hnf-single-content[data-sabri-hnf-post-content="1"], .sabri-hnf-single-content');
          		if (!publication) {
          			return null;
          		}
          		var node = publication.parentElement;
          		while (node && node !== document.body && node !== document.documentElement) {
          			if (node.matches(selectors) && safeTarget(node)) {
          				return node;
          			}
          			node = node.parentElement;
          		}
          		return null;
          	}

          	function applyTarget(target) {
          		if (!target || repaired) {
          			return false;
          		}

          		document.querySelectorAll('.sabri-shell-content-column[data-sabri-shell-content-column="true"]').forEach(function (candidate) {
          			if (candidate !== target) {
          				candidate.classList.remove('sabri-shell-content-column');
          				candidate.removeAttribute('data-sabri-shell-content-column');
          			}
          		});

          		target.classList.add('sabri-shell-content-column');
          		target.setAttribute('data-sabri-shell-content-column', 'true');
          		document.body.classList.remove('sabri-shell-layout-unresolved', 'sabri-shell-publication-layout-pending', 'sabri-shell-publication-layout-failed');
          		document.body.classList.toggle('sabri-shell-has-left-sidebar', Boolean(desktopSidebar('.sabri-shell-left-sidebar')));
          		document.body.classList.toggle('sabri-shell-has-right-sidebar', Boolean(desktopSidebar('.sabri-shell-right-sidebar')));
          		document.body.classList.add('sabri-shell-layout-ready', 'sabri-shell-managed-single-layout-repaired', 'sabri-shell-publication-layout-repaired');
          		repaired = true;
          		window.dispatchEvent(new Event('resize'));
          		if (observer) {
          			observer.disconnect();
          			observer = null;
          		}
          		return true;
          	}

          	function attemptRepair() {
          		return applyTarget(findPublicationTarget());
          	}

          	function failSafely() {
          		if (repaired) {
          			return;
          		}
          		document.body.classList.remove('sabri-shell-publication-layout-pending');
          		document.body.classList.add('sabri-shell-publication-layout-failed');
          		if (observer) {
          			observer.disconnect();
          			observer = null;
          		}
          	}

          	function start() {
          		if (!isPublicationRequest()) {
          			return;
          		}
          		document.body.classList.add('sabri-shell-publication-layout-pending');
          		if (attemptRepair()) {
          			return;
          		}
          		if ('MutationObserver' in window) {
          			observer = new MutationObserver(function () {
          				attemptRepair();
          			});
          			observer.observe(document.body, { childList: true, subtree: true });
          		}
          		[100, 350, 900, 1800].forEach(function (delay) {
          			window.setTimeout(attemptRepair, delay);
          		});
          		window.setTimeout(function () {
          			if (!attemptRepair()) {
          				failSafely();
          			}
          		}, 3000);
          	}

          	if (document.readyState === 'loading') {
          		document.addEventListener('DOMContentLoaded', start, { once: true });
          	} else {
          		start();
          	}
          }());
          '''
          js = '\n'.join(line[10:] if line.startswith('          ') else line for line in js.splitlines()) + '\n'
          (root / 'assets/js/shell-corrective-1.1.1.js').write_text(js, encoding='utf-8')

          css_path = root / 'assets/css/shell-corrective-1.1.1.css'
          css = css_path.read_text(encoding='utf-8')
          css = css.replace('.sabri-hnf-managed-single ', ':is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single) ')
          addition = r'''

          /* R3: legacy Markdown publications use a neutral File 21 display-integrity signal. */
          :is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single).sabri-shell-layout-ready .sabri-shell-content-column {
          	padding-block-start: max(20px, calc(var(--sabri-shell-gap, 24px) / 2));
          }

          @media (min-width: 1024px) {
          	/* Never allow fixed shell sidebars to cover unreadable publication content while target recovery is pending. */
          	body:is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single).sabri-shell-publication-layout-pending :is(
          		.sabri-shell-left-sidebar:not(.sabri-shell-left-sidebar-drawer),
          		.sabri-shell-right-sidebar:not(.sabri-shell-right-sidebar-drawer)
          	) {
          		visibility: hidden !important;
          		pointer-events: none !important;
          	}

          	body:is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single).sabri-shell-publication-layout-failed :is(
          		.sabri-shell-left-sidebar:not(.sabri-shell-left-sidebar-drawer),
          		.sabri-shell-right-sidebar:not(.sabri-shell-right-sidebar-drawer)
          	) {
          		display: none !important;
          	}

          	body:is(.sabri-hnf-managed-single, .sabri-hnf-content-integrity-single).sabri-shell-publication-layout-failed :is(
          		main.site-main,
          		main#main,
          		.site-main,
          		#primary,
          		.content-area
          	) {
          		box-sizing: border-box;
          		inline-size: min(100%, 960px);
          		max-inline-size: 960px;
          		margin-inline: auto;
          		padding-inline: clamp(16px, 3vw, 32px);
          	}
          }
          '''
          addition = '\n'.join(line[10:] if line.startswith('          ') else line for line in addition.splitlines()) + '\n'
          if 'sabri-shell-publication-layout-pending' not in css:
              css += addition
          css_path.write_text(css, encoding='utf-8')

          layout_class = r'''<?php
          /**
           * Corrective public layout bridge for File 21 publications.
           *
           * @package SabriUnifiedApplicationShell
           */

          namespace Sabri\UnifiedShell;

          if ( ! defined( 'ABSPATH' ) ) {
          	exit;
          }

          /** Adds bounded, ownership-safe public layout corrections. */
          final class LayoutCorrection {
          	/** Register corrective assets without replacing theme or companion markup. */
          	public static function register() {
          		add_filter( 'body_class', array( __CLASS__, 'body_classes' ), 35 );
          		add_action( 'wp_enqueue_scripts', array( __CLASS__, 'enqueue' ), 40 );
          	}

          	/** Add a stable release/body marker. */
          	public static function body_classes( $classes ) {
          		if ( ! is_array( $classes ) ) {
          			$classes = array();
          		}
          		$classes[] = 'sabri-shell-corrective-1-2-0-r3';
          		return array_values( array_unique( $classes ) );
          	}

          	/** Load only File 20-owned containment and target-recovery assets. */
          	public static function enqueue() {
          		if ( Layout::MINIMAL === Layout::current_mode() ) {
          			return;
          		}
          		$asset_version = SABRI_SHELL_VERSION . '-publication-layout-r3';
          		wp_enqueue_style(
          			'sabri-shell-corrective-1-2-0-r3',
          			SABRI_SHELL_URL . 'assets/css/shell-corrective-1.1.1.css',
          			array( 'sabri-shell' ),
          			$asset_version
          		);
          		wp_enqueue_script(
          			'sabri-shell-corrective-1-2-0-r3',
          			SABRI_SHELL_URL . 'assets/js/shell-corrective-1.1.1.js',
          			array( 'sabri-shell' ),
          			$asset_version,
          			true
          		);
          	}
          }
          '''
          layout_class = '\n'.join(line[10:] if line.startswith('          ') else line for line in layout_class.splitlines()) + '\n'
          (root / 'includes/class-layout-correction.php').write_text(layout_class, encoding='utf-8')

          test_path = root / 'tests/run-create-contract-layout.php'
          test = test_path.read_text(encoding='utf-8')
          old = "\t$assert( false !== strpos( $js, 'MutationObserver' ) && false !== strpos( $js, 'sabri-hnf-single-content' ), 'Bounded managed-single target recovery is present.' );\n"
          new = old + "\t$assert( false !== strpos( $js, 'sabri-hnf-content-integrity-single' ) && false !== strpos( $js, 'sabri-shell-publication-layout-failed' ), 'Neutral legacy-publication signal and fail-safe state are supported.' );\n\t$assert( false !== strpos( $css, 'sabri-shell-publication-layout-pending' ) && false !== strpos( $css, 'visibility: hidden !important' ), 'Desktop sidebar is suppressed while publication target recovery is pending.' );\n\t$assert( false !== strpos( $css, 'sabri-shell-publication-layout-failed' ) && false !== strpos( $css, 'max-inline-size: 960px' ), 'Failed target recovery preserves a readable centered publication without sidebar overlay.' );\n\t$layout_correction = file_get_contents( $root . '/includes/class-layout-correction.php' );\n\t$assert( false !== strpos( $layout_correction, \"SABRI_SHELL_VERSION . '-publication-layout-r3'\" ), 'Corrective assets use an explicit cache-busting identity.' );\n"
          if old not in test:
              raise SystemExit('File 20 test insertion anchor missing')
          test_path.write_text(test.replace(old, new, 1), encoding='utf-8')

          changelog = root / 'CHANGELOG.md'
          current = changelog.read_text(encoding='utf-8')
          entry = "# Changelog\n\n## 1.2.0 Publication Layout R3 — 2026-08-04\n\n- Accept File 21's neutral `sabri-hnf-content-integrity-single` signal for legacy Markdown articles without taking content ownership.\n- Recover and annotate the nearest safe theme content column for both managed and legacy public publications.\n- Hide fixed desktop sidebars during bounded recovery and fail to a readable centered content layout instead of overlaying the article.\n- Add explicit pending/repaired/failed states and cache-busting CSS/JavaScript identities.\n- Preserve no-DOM-reparenting, Safe Mode, File 00 authorization and File 22 Create-contract boundaries.\n\n"
          if current.startswith('# Changelog\n'):
              current = current[len('# Changelog\n'):].lstrip('\n')
          changelog.write_text(entry + current, encoding='utf-8')

          doc = '''# File 20 Publication Shell Layout Correction R3\n\n## Confirmed defect\n\nFile 20's target-recovery JavaScript activated only for `sabri-hnf-managed-single`. A legacy/general article with explicit Markdown was intentionally not File 21-owned, so the theme content column was not annotated and the fixed desktop left sidebar could cover the article.\n\n## Correction\n\n- Accept the neutral `sabri-hnf-content-integrity-single` signal in addition to the strict managed signal.\n- Keep File 20 limited to layout annotation; no content, post, taxonomy or publication ownership is acquired.\n- Suppress fixed sidebars while bounded target recovery is pending.\n- If recovery fails, hide fixed sidebars and center the publication rather than allowing an overlay.\n- Retain the prohibition on DOM movement, replacement or deletion.\n\n## Review rounds\n\n1. Full PHP and JavaScript syntax plus current Create/layout and Central Plan v4 regression suites.\n2. Fresh adversarial checks for neutral-class support, pending/failure states, no DOM reparenting, desktop fail-safe CSS and asset cache invalidation.\n\n## Lifecycle boundary\n\nRepository coding and automated QA do not equal Hostinger staging or live acceptance.\n'''
          (Path('.') / 'FILE-20-PUBLICATION-SHELL-LAYOUT-R3-2026-08-04.md').write_text(doc, encoding='utf-8')
          trigger = Path('.file20-publication-layout-trigger')
          if trigger.exists():
              trigger.unlink()
          PY

      - name: Review cycle 1
        shell: bash
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-unified-application-shell/assets/js/shell.js
          node --check sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php
          git diff --check

      - name: Review cycle 2 fresh adversarial
        shell: bash
        run: |
          set -euo pipefail
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          grep -Fq "sabri-hnf-content-integrity-single" sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          grep -Fq "sabri-shell-publication-layout-pending" sabri-unified-application-shell/assets/css/shell-corrective-1.1.1.css
          grep -Fq "sabri-shell-publication-layout-failed" sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          grep -Fq "publication-layout-r3" sabri-unified-application-shell/includes/class-layout-correction.php
          ! grep -Eq "appendChild\(|replaceChild\(|insertBefore\(" sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          node --check sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php
          git diff --check

      - name: Commit reviewed correction
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD -- .github/workflows
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-unified-application-shell/assets/css/shell-corrective-1.1.1.css sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js sabri-unified-application-shell/includes/class-layout-correction.php sabri-unified-application-shell/tests/run-create-contract-layout.php sabri-unified-application-shell/CHANGELOG.md FILE-20-PUBLICATION-SHELL-LAYOUT-R3-2026-08-04.md
          git add -A .file20-publication-layout-trigger 2>/dev/null || true
          git commit -m 'fix: prevent publication content from sitting beneath fixed shell sidebars'
          git push origin HEAD:fix/file20-publication-shell-layout-1.2.1
