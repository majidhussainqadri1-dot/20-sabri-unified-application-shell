name: File 20 Version 1.1.1 Corrective Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} contract and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Syntax-check all plugin PHP
        shell: bash
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run existing File 20 corrective suite
        shell: bash
        run: php sabri-unified-application-shell/tests/run.php

      - name: Run File 22 Create-contract and managed-layout suite
        shell: bash
        run: php sabri-unified-application-shell/tests/run-create-contract-layout.php

  static-and-package:
    name: Static boundaries and deterministic package
    needs: php-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip

      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check sabri-unified-application-shell/assets/js/shell.js
          node --check sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js

      - name: Static contract, ownership, and layout assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path('sabri-unified-application-shell')
          main = (root / 'sabri-unified-application-shell.php').read_text(encoding='utf-8')
          contract = (root / 'includes/class-create-contract.php').read_text(encoding='utf-8')
          correction = (root / 'includes/class-layout-correction.php').read_text(encoding='utf-8')
          css = (root / 'assets/css/shell-corrective-1.1.1.css').read_text(encoding='utf-8')
          js = (root / 'assets/js/shell-corrective-1.1.1.js').read_text(encoding='utf-8')
          readme = (root / 'readme.txt').read_text(encoding='utf-8')

          required_main = (
              '* Version: 1.1.1',
              "define( 'SABRI_SHELL_VERSION', '1.1.1' )",
              "define( 'SABRI_SHELL_CREATE_CONTRACT_VERSION', '1.0.1' )",
              "define( 'SABRI_SHELL_CREATE_CONTRACT_OWNER', 'sabri-unified-application-shell' )",
              "define( 'SABRI_SHELL_CREATE_FUNCTIONS_OWNED', true )",
              'function sabri_shell_create_contract_available()',
              'function sabri_shell_create_visible_for_current_user()',
              'CreateContract::register()',
              'LayoutCorrection::register()',
          )
          for symbol in required_main:
              if symbol not in main:
                  raise SystemExit(f'Missing File 20 1.1.1 bootstrap contract: {symbol}')

          for symbol in (
              "apply_filters( 'sabri_shell_can_show_create'",
              'get_current_user_id()',
              'SafeMode::disabled()',
              'private static $resolving',
              'sabri-shell-create-contract-denied',
          ):
              if symbol not in contract:
                  raise SystemExit(f'Missing current-user Create safeguard: {symbol}')

          for forbidden in ('$_GET[\'user_id\']', 'wp_set_current_user(', 'post-new.php'):
              if forbidden in main + contract:
                  raise SystemExit(f'Forbidden Create ownership/bypass pattern: {forbidden}')

          for forbidden in ('appendChild(', 'replaceChild(', 'insertBefore(', 'outerHTML', 'innerHTML ='):
              if forbidden in js:
                  raise SystemExit(f'Unsafe corrective DOM movement remains: {forbidden}')

          for required in ('MutationObserver', 'sabri-hnf-single-content', 'sabri-shell-managed-single-layout-repaired'):
              if required not in js:
                  raise SystemExit(f'Missing bounded layout recovery control: {required}')

          for required in ('flex-wrap: wrap', '.sabri-shell-user-card > div', 'overflow-wrap: anywhere', '.sabri-shell-create-contract-denied'):
              if required not in css:
                  raise SystemExit(f'Missing corrective CSS control: {required}')

          if css.count('{') != css.count('}'):
              raise SystemExit('Corrective CSS braces are unbalanced.')
          if 'Stable tag: 1.1.1' not in readme:
              raise SystemExit('WordPress stable tag is not 1.1.1.')
          if 'wp_enqueue_style' not in correction or 'wp_enqueue_script' not in correction:
              raise SystemExit('Corrective asset bridge is incomplete.')

          all_php = '\n'.join(path.read_text(encoding='utf-8') for path in root.rglob('*.php'))
          for forbidden in ('smc_professional_credentials', 'smc_clinics'):
              if forbidden in all_php:
                  raise SystemExit(f'File 20 still queries a non-owned table: {forbidden}')
          print('Static File 20 1.1.1 assertions passed.')
          PY

      - name: Build deterministic WordPress package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib

          root = Path('sabri-unified-application-shell')
          release = Path('release')
          release.mkdir(exist_ok=True)
          base = '20-sabri-unified-application-shell-1.1.1-CREATE-CONTRACT-LAYOUT-R2'
          archive_path = release / f'{base}.zip'
          manifest_path = release / f'{base}-MANIFEST.sha256'
          checksum_path = release / f'{base}.sha256'

          files = sorted(path for path in root.rglob('*') if path.is_file())
          manifest = []
          for path in files:
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              manifest.append(f'{digest}  {path.as_posix()}')
          manifest_path.write_text('\n'.join(manifest) + '\n', encoding='utf-8')

          with ZipFile(archive_path, 'w') as archive:
              for path in files:
                  info = ZipInfo(path.as_posix(), (2026, 8, 2, 0, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  archive.writestr(info, path.read_bytes())

          digest = hashlib.sha256(archive_path.read_bytes()).hexdigest()
          checksum_path.write_text(f'{digest}  {archive_path.name}\n', encoding='utf-8')
          print(digest)
          PY

      - name: Verify package equality, CRC, and exact contract
        shell: bash
        run: |
          set -euo pipefail
          base='20-sabri-unified-application-shell-1.1.1-CREATE-CONTRACT-LAYOUT-R2'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"
          rm -rf /tmp/file20-111
          mkdir -p /tmp/file20-111
          unzip -q "release/${base}.zip" -d /tmp/file20-111
          diff -qr /tmp/file20-111/sabri-unified-application-shell sabri-unified-application-shell
          unzip -p "release/${base}.zip" 'sabri-unified-application-shell/sabri-unified-application-shell.php' | grep -F "SABRI_SHELL_CREATE_CONTRACT_VERSION', '1.0.1'"
          unzip -p "release/${base}.zip" 'sabri-unified-application-shell/includes/class-create-contract.php' | grep -F "sabri_shell_can_show_create"
          unzip -p "release/${base}.zip" 'sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js' | grep -F 'sabri-hnf-single-content'

      - name: Write exact-head report
        shell: bash
        run: |
          cat > release/FILE-20-1.1.1-TEST-REPORT.md <<REPORT
          # File 20 Version 1.1.1 Corrective Evidence

          - Exact head: ${{ github.sha }}
          - PHP 7.4 syntax and tests: PASS
          - PHP 8.3 syntax and tests: PASS
          - Existing File 20 corrective suite: PASS
          - File 22 Create contract suite: PASS
          - JavaScript syntax: PASS
          - CSS/DOM ownership assertions: PASS
          - Deterministic package and source equality: PASS
          - Staging accepted: NO
          - Live deployed: NO
          REPORT

      - name: Upload verified File 20 package
        uses: actions/upload-artifact@v4
        with:
          name: file20-1.1.1-create-contract-layout-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.1.1-CREATE-CONTRACT-LAYOUT-R2.zip
            release/20-sabri-unified-application-shell-1.1.1-CREATE-CONTRACT-LAYOUT-R2.sha256
            release/20-sabri-unified-application-shell-1.1.1-CREATE-CONTRACT-LAYOUT-R2-MANIFEST.sha256
            release/FILE-20-1.1.1-TEST-REPORT.md
