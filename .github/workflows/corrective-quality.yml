name: File 20 Corrective Quality

on:
  pull_request:
    branches:
      - baseline/file-20-original-import

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.detect.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        shell: bash
        run: |
          if test -f '.corrective-upload/READY'; then
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          fi

  import-corrective-candidate:
    needs: preflight
    if: needs.preflight.outputs.pending == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Reconstruct and verify candidate package
        shell: bash
        run: |
          set -euo pipefail
          cat .corrective-upload/part-*.b64 | base64 --decode > /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip
          echo 'afa8c7e9fb1586aa8e3b872fe59e26c4133fad1fb8f1ee776183ae1adb0a3d15  /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip' | sha256sum --check
          unzip -t /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip
      - name: Replace source from verified candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sabri-unified-application-shell
          unzip -q /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip
          test -f sabri-unified-application-shell/sabri-unified-application-shell.php
          mkdir -p RELEASES
          cp /tmp/20-sabri-unified-application-shell-1.1.0-RC1.zip RELEASES/
          printf '%s  %s\n' 'afa8c7e9fb1586aa8e3b872fe59e26c4133fad1fb8f1ee776183ae1adb0a3d15' '20-sabri-unified-application-shell-1.1.0-RC1.zip' > RELEASES/CHECKSUMS.sha256
          cat > RELEASES/README.md <<'DOC'
          # File 20 Corrective Candidate

          - Package: `20-sabri-unified-application-shell-1.1.0-RC1.zip`
          - Plugin version: `1.1.0`
          - SHA-256: `afa8c7e9fb1586aa8e3b872fe59e26c4133fad1fb8f1ee776183ae1adb0a3d15`
          - Status: corrective release candidate; not production-accepted

          The exact original 1.0.0 baseline remains unchanged in `SOURCE-ARCHIVE/`. This candidate requires CI plus Hostinger staging acceptance before merge or deployment.
          DOC
          rm -rf .corrective-upload
      - name: Validate imported corrective source
        shell: bash
        run: |
          set -euo pipefail
          find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          node --check sabri-unified-application-shell/assets/js/shell.js
          php sabri-unified-application-shell/tests/run.php
          (cd RELEASES && sha256sum --check CHECKSUMS.sha256)
      - name: Commit verified corrective source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'fix: harden File 20 integration and layout'
          git push origin HEAD:${{ github.head_ref }}

  php-quality:
    needs: preflight
    if: needs.preflight.outputs.pending == 'false'
    name: PHP ${{ matrix.php }} quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: PHP syntax
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Corrective contract tests
        run: php sabri-unified-application-shell/tests/run.php

  static-and-package:
    needs: preflight
    if: needs.preflight.outputs.pending == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        run: node --check sabri-unified-application-shell/assets/js/shell.js
      - name: Static corrective assertions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          root = Path('sabri-unified-application-shell')
          css = (root / 'assets/css/shell.css').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('CSS braces are unbalanced.')
          js = (root / 'assets/js/shell.js').read_text(encoding='utf-8')
          for pattern in ('host.appendChild(', 'target.id =', "removeAttribute('id')", 'removeAttribute("id")'):
              if pattern in js:
                  raise SystemExit(f'Unsafe DOM mutation remains: {pattern}')
          layout = (root / 'includes/class-layout.php').read_text(encoding='utf-8')
          fallback = layout.split('public static function content_target_fallbacks()', 1)[1]
          for unsafe in ("'.wp-site-blocks'", "'#page'", "'.site'"):
              if unsafe in fallback:
                  raise SystemExit(f'Unsafe content fallback remains: {unsafe}')
          php = '\n'.join(p.read_text(encoding='utf-8') for p in root.rglob('*.php'))
          if 'post-new.php' in php:
              raise SystemExit('Core admin composer fallback remains.')
          for contract in (
              'slc_learning_home', 'he_encyclopedia_home', 'sdd_doctors_directory',
              'swc_worldwide_clinic', 'svw_video_wall', 'srl_reels', 'spl_library',
              'srf_radar', 'sai_study_guide', 'sabri_notification_bell',
              '_smc_official_founder', '_smc_doctor_verified', '_smc_trusted_publisher'
          ):
              if contract not in php:
                  raise SystemExit(f'Required corrected contract is missing: {contract}')
          print('Static corrective assertions passed.')
          PY
      - name: Version consistency
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '* Version: 1.1.0' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq "define( 'SABRI_SHELL_VERSION', '1.1.0' );" sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'Stable tag: 1.1.0' sabri-unified-application-shell/readme.txt
      - name: Corrective candidate package integrity
        shell: bash
        run: |
          set -euo pipefail
          (cd RELEASES && sha256sum --check CHECKSUMS.sha256)
          unzip -t RELEASES/20-sabri-unified-application-shell-1.1.0-RC1.zip
          rm -rf /tmp/file20-candidate
          mkdir -p /tmp/file20-candidate
          unzip -q RELEASES/20-sabri-unified-application-shell-1.1.0-RC1.zip -d /tmp/file20-candidate
          diff -qr /tmp/file20-candidate/sabri-unified-application-shell sabri-unified-application-shell
