name: File 20 Version 1.1.2 Zero-Known-Defects Quality

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} contract and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every plugin PHP file
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run File 20 regression suites
        shell: bash
        run: |
          set -euo pipefail
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php

  static-package:
    name: Ownership privacy performance and deterministic package
    needs: php-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          extensions: zip
      - name: JavaScript and static boundary checks
        shell: bash
        run: |
          set -euo pipefail
          node --check sabri-unified-application-shell/assets/js/shell.js
          node --check sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          grep -Fq '* Version: 1.1.2' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq "define( 'SABRI_SHELL_VERSION', '1.1.2' );" sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'Stable tag: 1.1.2' sabri-unified-application-shell/readme.txt
          grep -Fq "if ( ! \$base_allowed )" sabri-unified-application-shell/includes/class-create-contract.php
          grep -Fq 'sabri_shell_create_visible_for_current_user()' sabri-unified-application-shell/includes/class-renderer.php
          grep -Fq "SMC_Contracts::assertions" sabri-unified-application-shell/includes/class-integrations.php
          ! grep -Eq "smc_assertions_v1|_smc_official_founder|_smc_doctor_verified|_smc_trusted_publisher|post-new.php" sabri-unified-application-shell/includes/class-integrations.php sabri-unified-application-shell/includes/class-create-contract.php
          ! grep -R "'posts_per_page'[[:space:]]*=>[[:space:]]*-1" sabri-unified-application-shell/includes
          python3 - <<'PY'
          from pathlib import Path
          root = Path('sabri-unified-application-shell')
          css = (root / 'assets/css/shell-corrective-1.1.1.css').read_text(encoding='utf-8')
          js = (root / 'assets/js/shell-corrective-1.1.1.js').read_text(encoding='utf-8')
          if css.count('{') != css.count('}'):
              raise SystemExit('Corrective CSS braces are unbalanced.')
          for forbidden in ('appendChild(', 'replaceChild(', 'insertBefore(', 'outerHTML', 'innerHTML ='):
              if forbidden in js:
                  raise SystemExit(f'Unsafe corrective DOM mutation remains: {forbidden}')
          for required in ('MutationObserver', 'sabri-hnf-single-content', 'sabri-shell-managed-single-layout-repaired'):
              if required not in js:
                  raise SystemExit(f'Missing bounded layout recovery control: {required}')
          print('Static ownership, privacy, query and layout checks passed.')
          PY

      - name: Build deterministic installable package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil
          root = Path('sabri-unified-application-shell')
          release = Path('release')
          stage = release / 'stage' / root.name
          if release.exists():
              shutil.rmtree(release)
          stage.parent.mkdir(parents=True)
          shutil.copytree(root, stage)
          files = sorted(p for p in stage.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          manifest = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(stage).as_posix()}" for p in files]
          (stage / 'MANIFEST.sha256').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          base = '20-sabri-unified-application-shell-1.1.2-ZERO-KNOWN-DEFECTS-RC'
          archive = release / f'{base}.zip'
          with ZipFile(archive, 'w') as zf:
              for p in sorted(stage.rglob('*')):
                  if not p.is_file():
                      continue
                  info = ZipInfo((Path(root.name) / p.relative_to(stage)).as_posix(), (2026, 8, 2, 3, 0, 0))
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  zf.writestr(info, p.read_bytes())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (release / f'{base}.sha256').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          (release / f'{base}-SOURCE-MANIFEST.sha256').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          print(digest)
          PY

      - name: Verify package parity manifest checksum and CRC
        shell: bash
        run: |
          set -euo pipefail
          base='20-sabri-unified-application-shell-1.1.2-ZERO-KNOWN-DEFECTS-RC'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"
          rm -rf /tmp/file20-112
          mkdir -p /tmp/file20-112
          unzip -q "release/${base}.zip" -d /tmp/file20-112
          (cd /tmp/file20-112/sabri-unified-application-shell && sha256sum -c MANIFEST.sha256)
          diff -qr --exclude=MANIFEST.sha256 /tmp/file20-112/sabri-unified-application-shell sabri-unified-application-shell
          grep -Fq '* Version: 1.1.2' /tmp/file20-112/sabri-unified-application-shell/sabri-unified-application-shell.php

      - name: Write exact-head report
        shell: bash
        run: |
          cat > release/FILE-20-1.1.2-TEST-REPORT.md <<REPORT
          # File 20 Version 1.1.2 Corrective Evidence

          - Exact workflow SHA: ${{ github.sha }}
          - PHP 7.4 syntax and both regression suites: PASS
          - PHP 8.3 syntax and both regression suites: PASS
          - File 00 denial cannot be elevated by File 22: PASS
          - Server-rendered desktop/mobile Create authorization: PASS
          - Subject-bound File 00 provenance: PASS
          - Public doctor projection privacy: PASS
          - Bounded page discovery: PASS
          - JavaScript/CSS/DOM ownership checks: PASS
          - Deterministic package, embedded manifest, SHA-256 and ZIP CRC: PASS
          - Hostinger staging accepted: NO
          - Live deployed: NO
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: file20-1.1.2-zero-known-defects-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.1.2-ZERO-KNOWN-DEFECTS-RC.zip
            release/20-sabri-unified-application-shell-1.1.2-ZERO-KNOWN-DEFECTS-RC.sha256
            release/20-sabri-unified-application-shell-1.1.2-ZERO-KNOWN-DEFECTS-RC-SOURCE-MANIFEST.sha256
            release/FILE-20-1.1.2-TEST-REPORT.md
