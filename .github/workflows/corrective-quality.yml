name: File 20 Version 1.4.8 Eighth Ten-Round Hardened Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every source and test PHP file
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run every File 20 regression/adversarial suite
        run: |
          set -euo pipefail
          for test in sabri-unified-application-shell/tests/run*.php; do
            echo "==> ${test}"
            php "${test}"
          done

  static-package:
    name: Static ownership, recovery, privacy and deterministic production-package parity
    needs: php-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: JavaScript JSON CSS release and eighth-pass static checks
        run: |
          set -euo pipefail
          for js in sabri-unified-application-shell/assets/js/*.js; do node --check "${js}"; done
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          root = Path('sabri-unified-application-shell')
          main = (root/'sabri-unified-application-shell.php').read_text(encoding='utf-8')
          future = (root/'includes/class-future-shell-v5.php').read_text(encoding='utf-8')
          eighth = (root/'includes/class-future-shell-v5-eighth-hardening.php').read_text(encoding='utf-8')
          system = (root/'includes/class-system-check.php').read_text(encoding='utf-8')
          audit = (root/'includes/class-plan-v4-audit.php').read_text(encoding='utf-8')
          recovery = (root/'includes/class-plan-v4-recovery.php').read_text(encoding='utf-8')
          safe = (root/'includes/class-safe-mode.php').read_text(encoding='utf-8')
          snapshot = (root/'includes/class-snapshot.php').read_text(encoding='utf-8')
          seventh = (root/'includes/class-future-shell-v5-seventh-hardening.php').read_text(encoding='utf-8')
          readme = (root/'README.md').read_text(encoding='utf-8')
          readmetxt = (root/'readme.txt').read_text(encoding='utf-8')

          assert '* Version: 1.4.8' in main
          assert "define( 'SABRI_SHELL_VERSION', '1.4.8' );" in main
          assert 'Stable tag: 1.4.8' in readmetxt
          assert 'FutureShellV5EighthHardening::register();' in main
          assert "CONTRACT_VERSION = '1.0.8'" in eighth
          assert 'Version: `1.4.8`' in readme

          feature_ids = ['command_palette','pwa_shell','offline_mode','data_saver','recent_resume','module_circuit_breaker','last_known_good','performance_guardian','smart_navigation','keyboard_accessibility','focus_mode','split_workspace','adaptive_foldable','view_transitions','predictive_prefetch','language_direction','accessibility_center','release_rings']
          assert len(feature_ids) == 18 and all(("'"+x+"'") in future for x in feature_ids)
          for cf in ['CF-01','CF-02','CF-03','CF-04','CF-05','CF-06']:
              assert f"$registry['{cf}']" in seventh

          assert 'file20_appearance_editor' in eighth and 'retired' in eighth
          assert 'force_subdirectory_safe_sensitive_layout' in eighth
          assert '/system-check/export' in eighth
          assert all(x in system for x in ["'id'", "'severity'", "'evidence'", "'last_run'", "'affected_surface'", "'remediation'"])
          assert "apply_filters( 'sabri_shell_system_check_sections'" in system
          assert 'ANCHOR_OPTION' in audit and 'rehash_events' in audit and 'sabri_shell_audit_chain_invalid' in audit
          assert 'repair_action_diff' in recovery and 'Settings::ensure_defaults();' in recovery
          assert "'schema_compatible'" in recovery and 'FutureShellV5::OPTION' in recovery
          assert 'QUERY_NONCE_ACTION' in safe and 'wp_verify_nonce' in safe and 'EMERGENCY_META_OPTION' in safe
          assert 'FORMAT_VERSION = 2' in snapshot and "'future_settings'" in snapshot
          assert "update_option( 'page_on_front'" not in snapshot and "update_option( 'show_on_front'" not in snapshot
          assert "remove_action( 'admin_post_sabri_shell_repair'" in eighth
          assert "remove_action( 'admin_post_sabri_shell_rollback'" in eighth
          assert "remove_action( 'admin_post_sabri_shell_emergency'" in eighth

          all_shell = future + eighth + system + audit + recovery + safe + snapshot
          assert 'CREATE TABLE' not in all_shell and 'dbDelta(' not in all_shell and 'INSERT INTO' not in all_shell
          for p in sorted((root/'assets/css').glob('*.css')):
              css = p.read_text(encoding='utf-8')
              assert css.count('{') == css.count('}'), f'Unbalanced CSS: {p.name}'
          print('Static File 20 v1.4.8 eighth-pass ownership/recovery/privacy/release checks passed.')
          PY

      - name: Build deterministic production-only package and prove parity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil

          root = Path('sabri-unified-application-shell')
          release = Path('release')
          stage = release/'stage'/root.name
          extract = release/'clean-extract'
          excluded_dirs = {'tests', 'node_modules', '.git', '.github', 'coverage', '.pytest_cache', '__pycache__'}
          excluded_suffixes = {'.log', '.tmp'}

          if release.exists(): shutil.rmtree(release)
          stage.mkdir(parents=True)

          def production_source_file(path: Path) -> bool:
              rel = path.relative_to(root)
              if any(part in excluded_dirs for part in rel.parts): return False
              if path.suffix.lower() in excluded_suffixes: return False
              return path.is_file()

          source_files = sorted(p for p in root.rglob('*') if production_source_file(p))
          assert source_files
          assert not any('tests' in p.relative_to(root).parts for p in source_files)

          source_manifest = []
          for src in source_files:
              rel = src.relative_to(root)
              dest = stage/rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest)
              source_manifest.append(f"{hashlib.sha256(src.read_bytes()).hexdigest()}  {rel.as_posix()}")

          manifest_text = '\n'.join(source_manifest) + '\n'
          (stage/'MANIFEST.sha256').write_text(manifest_text, encoding='utf-8')
          staged_runtime = sorted(p.relative_to(stage).as_posix() for p in stage.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          source_runtime = sorted(p.relative_to(root).as_posix() for p in source_files)
          assert staged_runtime == source_runtime

          base = '20-sabri-unified-application-shell-1.4.8-EIGHTH-TEN-ROUND-HARDENED'
          archive = release/f'{base}.zip'
          fixed_time = (2026, 8, 8, 16, 15, 0)
          with ZipFile(archive, 'w') as zf:
              for p in sorted(stage.rglob('*')):
                  if not p.is_file(): continue
                  arcname = (Path(root.name)/p.relative_to(stage)).as_posix()
                  info = ZipInfo(arcname, fixed_time)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  zf.writestr(info, p.read_bytes())

          with ZipFile(archive) as zf:
              names = zf.namelist()
              assert names and len(names) == len(set(names))
              for name in names:
                  pp = PurePosixPath(name)
                  assert not pp.is_absolute()
                  assert '..' not in pp.parts
                  assert pp.parts and pp.parts[0] == root.name
                  assert 'tests' not in pp.parts

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (release/f'{base}.sha256').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          (release/f'{base}-SOURCE-MANIFEST.sha256').write_text(manifest_text, encoding='utf-8')
          extract.mkdir(parents=True)
          with ZipFile(archive) as zf: zf.extractall(extract)
          extracted_root = extract/root.name
          embedded = (extracted_root/'MANIFEST.sha256').read_text(encoding='utf-8')
          external = (release/f'{base}-SOURCE-MANIFEST.sha256').read_text(encoding='utf-8')
          assert embedded == external == manifest_text
          expected = {}
          for line in manifest_text.splitlines():
              sha, rel = line.split('  ', 1); expected[rel] = sha
          actual_files = sorted(p.relative_to(extracted_root).as_posix() for p in extracted_root.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          assert actual_files == sorted(expected)
          for rel, sha in expected.items():
              assert hashlib.sha256((extracted_root/rel).read_bytes()).hexdigest() == sha
          assert not (extracted_root/'tests').exists()
          assert (extracted_root/'sabri-unified-application-shell.php').is_file()
          assert (extracted_root/'includes/class-future-shell-v5-eighth-hardening.php').is_file()
          print('Deterministic 1.4.8 production package parity/path/integrity PASS.')
          PY
          base='20-sabri-unified-application-shell-1.4.8-EIGHTH-TEN-ROUND-HARDENED'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"

      - name: Write exact-head eighth-audit report
        run: |
          cat > release/FILE-20-1.4.8-EIGHTH-TEN-ROUND-TEST-REPORT.md <<REPORT
          # File 20 Version 1.4.8 Eighth Ten-Round Corrective Evidence
          - Exact workflow SHA: ${{ github.sha }}
          - PHP 7.4/8.3 syntax and every repository regression/adversarial suite: PASS
          - Future Shell approved feature count: 18/18; no nineteenth feature added
          - File 25 appearance ownership/retired File 20 editor: PASS
          - Root/subdirectory sensitive task layout: PASS
          - Structured System Check sections and sanitized export: PASS
          - Bounded audit anchor/retention/privacy-erasure integrity: PASS
          - Audit/assurance mbstring-optional sanitization: PASS
          - Dry-run repair diff and real settings normalization: PASS
          - Version + schema compatible rollback and File20-only snapshots: PASS
          - Nonce-bound Safe Mode and audited Emergency lifecycle: PASS
          - Hardened admin Repair/Rollback/Emergency routing: PASS
          - CF-01..CF-06 conditional ownership preserved: PASS
          - Production ZIP excludes development tests: PASS
          - ZIP path/root/duplicate-entry safety: PASS
          - Clean production source/stage/extracted SHA-256 parity: PASS
          - Embedded/external manifest equality and ZIP CRC: PASS
          - Hostinger staging accepted: NO
          - Live deployed: NO
          - Operationally accepted: NO
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: file20-1.4.8-eighth-ten-round-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.4.8-EIGHTH-TEN-ROUND-HARDENED.zip
            release/20-sabri-unified-application-shell-1.4.8-EIGHTH-TEN-ROUND-HARDENED.sha256
            release/20-sabri-unified-application-shell-1.4.8-EIGHTH-TEN-ROUND-HARDENED-SOURCE-MANIFEST.sha256
            release/FILE-20-1.4.8-EIGHTH-TEN-ROUND-TEST-REPORT.md
