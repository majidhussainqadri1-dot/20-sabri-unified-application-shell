name: File 20 Version 1.4.2 Second Ten-Round Hardened Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} contracts and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every plugin PHP file
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run all File 20 regression suites
        run: |
          set -euo pipefail
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-context-navigation.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php
          php sabri-unified-application-shell/tests/run-four-plan-harmonization.php
          php sabri-unified-application-shell/tests/run-future-shell-v5.php

  static-package:
    name: Ownership privacy security future-shell and deterministic package
    needs: php-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript JSON CSS and static boundaries
        run: |
          set -euo pipefail
          for js in sabri-unified-application-shell/assets/js/*.js; do node --check "$js"; done
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
          grep -Fq '* Version: 1.4.2' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq "define( 'SABRI_SHELL_VERSION', '1.4.2' );" sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'Stable tag: 1.4.2' sabri-unified-application-shell/readme.txt
          grep -Fq 'Version: `1.4.2`' sabri-unified-application-shell/README.md
          grep -Fq 'FutureShellV5::register();' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'FutureShellV5Hardening::register();' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'FutureShellV5ClientContext::register();' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'FutureShellV5ControlGuard::register();' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'FutureShellV5SecondHardening::register();' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'preserve_partial_future_settings' sabri-unified-application-shell/includes/class-future-shell-v5-second-hardening.php
          grep -Fq 'scoped_private_paths' sabri-unified-application-shell/includes/class-future-shell-v5-second-hardening.php
          grep -Fq 'status_header( 410 )' sabri-unified-application-shell/includes/class-future-shell-v5-second-hardening.php
          grep -Fq 'CentralPlanContract::visual_tokens()' sabri-unified-application-shell/includes/class-future-shell-v5-second-hardening.php
          grep -Fq 'MAX_CIRCUITS' sabri-unified-application-shell/includes/class-future-shell-v5-second-hardening.php
          grep -Fq 'Layout::IMMERSIVE === Layout::current_mode()' sabri-unified-application-shell/includes/class-future-shell-v5-second-hardening.php
          grep -Fq 'event.stopImmediatePropagation()' sabri-unified-application-shell/assets/js/future-shell-v5-editable-guard.js
          grep -Fq 'capture_previous_lkg' sabri-unified-application-shell/includes/class-future-shell-v5-hardening.php
          grep -Fq 'sabri_shell_invalid_release_ring' sabri-unified-application-shell/includes/class-future-shell-v5-control-guard.php
          grep -Fq 'PHP_INT_MAX' sabri-unified-application-shell/includes/class-future-shell-v5-control-guard.php
          grep -Fq 'finally {' sabri-unified-application-shell/includes/class-future-shell-v5-control-guard.php
          grep -Fq 'self.registration.unregister()' sabri-unified-application-shell/includes/class-future-shell-v5-hardening.php
          grep -Fq 'const IMMERSIVE' sabri-unified-application-shell/includes/class-layout.php
          grep -Fq 'sabri_shell_file25_visual_contract' sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq "'26' => array( 'Search Discovery and Ranking'" sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq 'sabri_shell_file26_search_contract' sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq 'WELCOME_SESSION_COOKIE' sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq 'single-free-tier' sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq "donor_advantage']     = false" sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq 'sabriShellRecentPublicRoutesV' sabri-unified-application-shell/assets/js/future-shell-v5.js
          grep -Fq 'Object.keys(prefetched).length >= 3' sabri-unified-application-shell/assets/js/future-shell-v5.js
          grep -Fq 'CIRCUIT_THRESHOLD' sabri-unified-application-shell/includes/class-future-shell-v5.php
          grep -Fq 'hash_equals' sabri-unified-application-shell/includes/class-future-shell-v5.php
          grep -Fq "case 'limited'" sabri-unified-application-shell/includes/class-future-shell-v5.php
          grep -Fq 'var(--sabri-shell-radius' sabri-unified-application-shell/assets/css/future-shell-v5.css
          grep -Fq 'var(--sabri-shell-shadow' sabri-unified-application-shell/assets/css/future-shell-v5.css
          ! grep -Fq 'sendBeacon' sabri-unified-application-shell/assets/js/future-shell-v5.js
          ! grep -Fq 'history.back()' sabri-unified-application-shell/assets/js/future-shell-v5.js
          ! grep -Fq '.sabri-shell-data-saver *' sabri-unified-application-shell/assets/css/future-shell-v5.css
          ! grep -Fq '.sabri-shell-a11y-spacing p,.sabri-shell-a11y-spacing li' sabri-unified-application-shell/assets/css/future-shell-v5.css
          ! grep -Fq -- '--sabri-shell-v5-accent' sabri-unified-application-shell/assets/css/future-shell-v5.css
          ! grep -Fq 'get_search_query()' sabri-unified-application-shell/includes/class-renderer.php
          ! grep -Eq "'bottom_nav'[[:space:]]*=>[[:space:]]*true" sabri-unified-application-shell/includes/class-defaults.php
          ! grep -Eq "smc_assertions_v1|_smc_official_founder|_smc_doctor_verified|_smc_trusted_publisher|post-new.php" sabri-unified-application-shell/includes/class-integrations.php sabri-unified-application-shell/includes/class-create-contract.php
          ! grep -R "'posts_per_page'[[:space:]]*=>[[:space:]]*-1" sabri-unified-application-shell/includes
          ! grep -R --line-number --include='*.php' --include='*.css' '#ff8a1f' sabri-unified-application-shell/includes sabri-unified-application-shell/assets/css sabri-unified-application-shell/sabri-unified-application-shell.php
          python - <<'PY'
          from pathlib import Path
          root=Path('sabri-unified-application-shell')
          for p in sorted((root/'assets/css').glob('*.css')):
              css=p.read_text(encoding='utf-8'); assert css.count('{')==css.count('}'), f'Unbalanced CSS: {p.name}'
          future=(root/'includes/class-future-shell-v5.php').read_text(encoding='utf-8')
          hard=(root/'includes/class-future-shell-v5-hardening.php').read_text(encoding='utf-8')
          client=(root/'includes/class-future-shell-v5-client-context.php').read_text(encoding='utf-8')
          control=(root/'includes/class-future-shell-v5-control-guard.php').read_text(encoding='utf-8')
          second=(root/'includes/class-future-shell-v5-second-hardening.php').read_text(encoding='utf-8')
          guard=(root/'assets/js/future-shell-v5-editable-guard.js').read_text(encoding='utf-8')
          feature_ids=['command_palette','pwa_shell','offline_mode','data_saver','recent_resume','module_circuit_breaker','last_known_good','performance_guardian','smart_navigation','keyboard_accessibility','focus_mode','split_workspace','adaptive_foldable','view_transitions','predictive_prefetch','language_direction','accessibility_center','release_rings']
          assert all(("'"+x+"'") in future for x in feature_ids) and len(feature_ids)==18
          assert 'CREATE TABLE' not in future+hard+client+control+second and 'dbDelta(' not in future+hard+client+control+second
          assert "'disabled'" in hard and 'return (bool) $enabled && $allowed;' in hard
          assert 'sabri_shell_invalid_release_ring' in control and 'finally {' in control
          assert 'scoped_private_paths' in second and 'status_header( 410 )' in second
          assert 'CentralPlanContract::visual_tokens()' in second and 'MAX_CIRCUITS' in second
          assert 'preserve_partial_future_settings' in second and 'event.stopImmediatePropagation()' in guard
          print('Static v1.4.2 second-ten-round ownership/privacy/security/future-shell checks passed.')
          PY

      - name: Build deterministic installable package
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil
          root=Path('sabri-unified-application-shell'); release=Path('release'); stage=release/'stage'/root.name
          if release.exists(): shutil.rmtree(release)
          stage.parent.mkdir(parents=True); shutil.copytree(root,stage)
          files=sorted(p for p in stage.rglob('*') if p.is_file() and p.name!='MANIFEST.sha256')
          manifest=[f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(stage).as_posix()}" for p in files]
          (stage/'MANIFEST.sha256').write_text('\n'.join(manifest)+'\n',encoding='utf-8')
          base='20-sabri-unified-application-shell-1.4.2-SECOND-TEN-ROUND-HARDENED'
          archive=release/f'{base}.zip'
          with ZipFile(archive,'w') as zf:
              for p in sorted(stage.rglob('*')):
                  if p.is_file():
                      info=ZipInfo((Path(root.name)/p.relative_to(stage)).as_posix(),(2026,8,8,10,0,0)); info.compress_type=ZIP_DEFLATED; info.external_attr=(0o100644 & 0xFFFF)<<16; zf.writestr(info,p.read_bytes())
          digest=hashlib.sha256(archive.read_bytes()).hexdigest(); (release/f'{base}.sha256').write_text(f'{digest}  {archive.name}\n',encoding='utf-8'); (release/f'{base}-SOURCE-MANIFEST.sha256').write_text('\n'.join(manifest)+'\n',encoding='utf-8')
          PY
          base='20-sabri-unified-application-shell-1.4.2-SECOND-TEN-ROUND-HARDENED'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"
          rm -rf release/clean-extract && mkdir -p release/clean-extract
          unzip -q "release/${base}.zip" -d release/clean-extract
          grep -Fq '* Version: 1.4.2' release/clean-extract/sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'FutureShellV5Hardening::register();' release/clean-extract/sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'FutureShellV5ClientContext::register();' release/clean-extract/sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'FutureShellV5ControlGuard::register();' release/clean-extract/sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'FutureShellV5SecondHardening::register();' release/clean-extract/sabri-unified-application-shell/sabri-unified-application-shell.php
          test -f release/clean-extract/sabri-unified-application-shell/assets/js/future-shell-v5-editable-guard.js

      - name: Write exact-head report
        run: |
          cat > release/FILE-20-1.4.2-SECOND-TEN-ROUND-TEST-REPORT.md <<REPORT
          # File 20 Version 1.4.2 Second Ten-Round Corrective Evidence
          - Exact workflow SHA: ${{ github.sha }}
          - Existing File 20 PHP 7.4/8.3 regression/adversarial suites: PASS
          - Future Shell v5 18/18 enhancement + first and second ten-round hardening tests: PASS
          - Subdirectory privacy, PWA retirement/visual ownership, partial settings, circuit bounds, editor shortcut and immersive-workspace gates: PASS
          - JavaScript/CSS/JSON integrity: PASS
          - Deterministic ZIP, manifest, SHA-256, CRC and clean extraction: PASS
          - Hostinger staging accepted: NO
          - Live deployed: NO
          - Operationally accepted: NO
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: file20-1.4.2-second-ten-round-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.4.2-SECOND-TEN-ROUND-HARDENED.zip
            release/20-sabri-unified-application-shell-1.4.2-SECOND-TEN-ROUND-HARDENED.sha256
            release/20-sabri-unified-application-shell-1.4.2-SECOND-TEN-ROUND-HARDENED-SOURCE-MANIFEST.sha256
            release/FILE-20-1.4.2-SECOND-TEN-ROUND-TEST-REPORT.md
