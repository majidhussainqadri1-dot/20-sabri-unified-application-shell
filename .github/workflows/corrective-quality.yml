name: File 20 Version 1.2.1 Publishing Dashboard Entry Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'release/**']
  workflow_dispatch:

permissions:
  contents: read

env:
  FILE23_SHA: a8a8c805f4730998ccb44bd95c87591836561759
  FILE25_SHA: 95000198b321bee1a8e19d92079646674b3c93c3

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} contracts and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every plugin PHP file
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run all File 20 regression suites
        run: |
          set -euo pipefail
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-publishing-dashboard-entry.php

  real-entry-contracts:
    name: Real File 23 and File 25 entry contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          path: file20
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/23-sabri-doctor-founder-publishing-dashboard
          ref: ${{ env.FILE23_SHA }}
          path: file23
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: majidhussainqadri1-dot/25-sabri-public-ui-profile-timeline-visual-experience
          ref: ${{ env.FILE25_SHA }}
          path: file25
          persist-credentials: false
      - name: Verify exact companion heads
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C file23 rev-parse HEAD)" = "$FILE23_SHA"
          test "$(git -C file25 rev-parse HEAD)" = "$FILE25_SHA"
      - name: Verify File 23 authority and route contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'public static function is_user_approved' file23/includes/class-spdb-membership-guard.php
          grep -Fq 'public static function is_user_suspended' file23/includes/class-spdb-membership-guard.php
          grep -Fq 'public static function is_user_founder' file23/includes/class-spdb-membership-guard.php
          grep -Fq 'public static function can_user_publish' file23/includes/class-spdb-membership-guard.php
          grep -Fq 'public static function can_user_view_restricted_dashboard' file23/includes/class-spdb-membership-guard.php
          grep -Fq "current_user_can( 'spdb_view_dashboard'" file23/includes/class-spdb-dashboard-router.php
          grep -Fq 'public static function route_url' file23/includes/class-spdb-dashboard-router.php
          grep -Fq "public const ROUTE           = 'publishing-dashboard'" file23/includes/class-spdb-dashboard-router.php
      - name: Verify File 25 owner-profile action contract
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq "'publishing_dashboard'" file25/includes/class-plan-completion.php
          grep -Fq "apply_filters('sabri_public_experience/action_url'" file25/includes/class-plan-completion.php
          grep -Fq "'publishing_dashboard' => __('Publishing Dashboard'" file25/includes/class-plan-completion.php
          grep -Fq 'Plan_Completion::render_profile_actions($profile)' file25/templates/partials/profile-hero.php
      - name: Verify File 20 consumes without duplicating ownership
        shell: bash
        run: |
          set -euo pipefail
          bridge='file20/sabri-unified-application-shell/includes/class-publishing-dashboard-entry.php'
          grep -Fq "SPDB_Dashboard_Router::route_url( 'overview' )" "$bridge"
          grep -Fq "SPDB_Capabilities::current_user_can( 'spdb_view_dashboard' )" "$bridge"
          grep -Fq "add_filter( 'sabri_public_experience/action_url'" "$bridge"
          ! grep -Eq 'register_rewrite_rule|add_rewrite_rule|register_post_type|wp_insert_post|wp_update_post|get_user_meta' "$bridge"

  static-package:
    name: Ownership privacy UI and deterministic package
    needs: [php-quality, real-entry-contracts]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: JavaScript JSON CSS and static boundaries
        run: |
          set -euo pipefail
          node --check sabri-unified-application-shell/assets/js/shell.js
          node --check sabri-unified-application-shell/assets/js/shell-corrective-1.1.1.js
          node --check sabri-unified-application-shell/assets/js/publishing-dashboard-entry.js
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
          grep -Fq '* Version: 1.2.1' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq "define( 'SABRI_SHELL_VERSION', '1.2.1' );" sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'Stable tag: 1.2.1' sabri-unified-application-shell/readme.txt
          grep -Fq 'PublishingDashboardEntry::register();' sabri-unified-application-shell/includes/class-plugin.php
          grep -Fq "SPDB_Dashboard_Router::route_url( 'overview' )" sabri-unified-application-shell/includes/class-publishing-dashboard-entry.php
          grep -Fq "SPDB_Capabilities::current_user_can( 'spdb_view_dashboard' )" sabri-unified-application-shell/includes/class-publishing-dashboard-entry.php
          grep -Fq 'sabri_public_experience/action_url' sabri-unified-application-shell/includes/class-publishing-dashboard-entry.php
          grep -Fq 'data-sabri-publishing-dashboard-entry' sabri-unified-application-shell/assets/js/publishing-dashboard-entry.js
          grep -Fq ':focus-visible' sabri-unified-application-shell/assets/css/publishing-dashboard-entry.css
          grep -Fq 'forced-colors' sabri-unified-application-shell/assets/css/publishing-dashboard-entry.css
          grep -Fq 'const IMMERSIVE' sabri-unified-application-shell/includes/class-layout.php
          grep -Fq 'sabri_shell_file25_visual_contract' sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq 'flex-wrap: nowrap !important' sabri-unified-application-shell/assets/css/shell-central-plan-v4.css
          grep -Fq "if ( ! \$base_allowed )" sabri-unified-application-shell/includes/class-create-contract.php
          grep -Fq 'sabri_shell_create_visible_for_current_user()' sabri-unified-application-shell/includes/class-renderer.php
          grep -Fq 'SMC_Contracts::assertions' sabri-unified-application-shell/includes/class-integrations.php
          ! grep -Eq "smc_assertions_v1|_smc_official_founder|_smc_doctor_verified|_smc_trusted_publisher|post-new.php" sabri-unified-application-shell/includes/class-integrations.php sabri-unified-application-shell/includes/class-create-contract.php
          ! grep -R "'posts_per_page'[[:space:]]*=>[[:space:]]*-1" sabri-unified-application-shell/includes
          python - <<'PY'
          from pathlib import Path
          root = Path('sabri-unified-application-shell')
          for name in (
              'assets/css/shell-corrective-1.1.1.css',
              'assets/css/shell-central-plan-v4.css',
              'assets/css/publishing-dashboard-entry.css',
          ):
              css = (root / name).read_text(encoding='utf-8')
              assert css.count('{') == css.count('}'), f'Unbalanced CSS: {name}'
          for name in (
              'assets/js/shell-corrective-1.1.1.js',
              'assets/js/publishing-dashboard-entry.js',
          ):
              js = (root / name).read_text(encoding='utf-8')
              for forbidden in ('outerHTML', 'innerHTML =', 'document.write('):
                  assert forbidden not in js, f'Unsafe DOM mutation in {name}: {forbidden}'
          entry = (root / 'includes/class-publishing-dashboard-entry.php').read_text(encoding='utf-8')
          for forbidden in ('get_user_meta(', 'register_post_type(', 'add_rewrite_rule(', 'wp_insert_post('):
              assert forbidden not in entry, f'Ownership/authority bypass in entry service: {forbidden}'
          print('Static ownership, privacy, cross-file and accessibility checks passed.')
          PY

      - name: Build deterministic installable package
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil
          root = Path('sabri-unified-application-shell')
          release = Path('release')
          stage = release / 'stage' / root.name
          if release.exists():
              shutil.rmtree(release)
          stage.parent.mkdir(parents=True)
          shutil.copytree(root, stage)
          files = sorted(p for p in stage.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          manifest = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(stage).as_posix()}" for p in files]
          (stage / 'MANIFEST.sha256').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          base = '20-sabri-unified-application-shell-1.2.1-FILE23-ENTRY-R1'
          archive = release / f'{base}.zip'
          with ZipFile(archive, 'w') as zf:
              for p in sorted(stage.rglob('*')):
                  if p.is_file():
                      info = ZipInfo((Path(root.name) / p.relative_to(stage)).as_posix(), (2026, 8, 4, 17, 50, 0))
                      info.compress_type = ZIP_DEFLATED
                      info.external_attr = (0o100644 & 0xFFFF) << 16
                      zf.writestr(info, p.read_bytes())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (release / f'{base}.sha256').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          (release / f'{base}-SOURCE-MANIFEST.sha256').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          PY
          base='20-sabri-unified-application-shell-1.2.1-FILE23-ENTRY-R1'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"

      - name: Write exact-head report
        run: |
          cat > release/FILE-20-1.2.1-FILE23-ENTRY-TEST-REPORT.md <<REPORT
          # File 20 Version 1.2.1 — File 23 Publishing Dashboard Entry Evidence

          - Exact workflow SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          - File 23 exact contract SHA: $FILE23_SHA
          - File 25 exact profile-action SHA: $FILE25_SHA
          - PHP 7.4/8.3 syntax and all File 20 regression suites: PASS
          - Guest/pending/suspended/unauthorized visibility denial: PASS
          - Founder and publishing-Doctor entry contract: PASS
          - File 23 exact router and capability ownership: PASS
          - File 25 own-profile action integration: PASS
          - Sidebar, account menu and toolbar entry source gates: PASS
          - Same-site URL, bounded mounting and unsafe-DOM checks: PASS
          - Accessibility and deterministic package gates: PASS
          - Hostinger staging accepted: NO
          - Live deployed: NO
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: file20-1.2.1-file23-entry-${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.2.1-FILE23-ENTRY-R1.zip
            release/20-sabri-unified-application-shell-1.2.1-FILE23-ENTRY-R1.sha256
            release/20-sabri-unified-application-shell-1.2.1-FILE23-ENTRY-R1-SOURCE-MANIFEST.sha256
            release/FILE-20-1.2.1-FILE23-ENTRY-TEST-REPORT.md
