name: File 20 Version 1.4.6 Sixth Ten-Round Hardened Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every source and test PHP file
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run every File 20 regression/adversarial suite
        run: |
          set -euo pipefail
          for test in sabri-unified-application-shell/tests/run*.php; do
            echo "==> ${test}"
            php "${test}"
          done

  static-package:
    name: Static ownership, compatibility truth, production package parity and path safety
    needs: php-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: JavaScript JSON CSS release, compatibility and ownership checks
        run: |
          set -euo pipefail
          for js in sabri-unified-application-shell/assets/js/*.js; do node --check "${js}"; done
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          root = Path('sabri-unified-application-shell')
          main = (root/'sabri-unified-application-shell.php').read_text(encoding='utf-8')
          future = (root/'includes/class-future-shell-v5.php').read_text(encoding='utf-8')
          hard = (root/'includes/class-future-shell-v5-hardening.php').read_text(encoding='utf-8')
          second = (root/'includes/class-future-shell-v5-second-hardening.php').read_text(encoding='utf-8')
          third = (root/'includes/class-future-shell-v5-third-hardening.php').read_text(encoding='utf-8')
          fourth = (root/'includes/class-future-shell-v5-fourth-hardening.php').read_text(encoding='utf-8')
          fifth = (root/'includes/class-future-shell-v5-fifth-hardening.php').read_text(encoding='utf-8')
          sixth = (root/'includes/class-future-shell-v5-sixth-hardening.php').read_text(encoding='utf-8')
          control = (root/'includes/class-future-shell-v5-control-guard.php').read_text(encoding='utf-8')
          guard = (root/'assets/js/future-shell-v5-editable-guard.js').read_text(encoding='utf-8')
          readme = (root/'README.md').read_text(encoding='utf-8')
          readmetxt = (root/'readme.txt').read_text(encoding='utf-8')
          assert '* Version: 1.4.6' in main
          assert "define( 'SABRI_SHELL_VERSION', '1.4.6' );" in main
          assert 'Version: `1.4.6`' in readme
          assert 'Stable tag: 1.4.6' in readmetxt
          assert 'FutureShellV5FifthHardening::register();' in main
          assert 'FutureShellV5SixthHardening::register();' in main
          assert "CONTRACT_VERSION = '1.0.5'" in fifth
          assert "CONTRACT_VERSION = '1.0.6'" in sixth
          assert 'sabri_shell_future_internal_principal_allowed' in fifth
          assert "current_user_can( 'manage_options' )" in fifth
          assert 'sabri_shell_invalid_release_ring' in control
          assert 'MAX_PRIVATE_PATHS = 128' in third and 'privacyPolicyComplete' in third and 'POLICY_COMPLETE' in third
          assert 'membership-core-1.2.13' in sixth
          assert "'cf01_contract'              => '1.0.0'" in sixth
          assert "'foundation_contract'      => '2.0.0'" in sixth
          assert "'provider_schema'          => '1.2.0'" in sixth
          assert 'modern-auth-runtime-1.3.1-third-ten-round-reviewed' in sixth
          assert "'passkey_schema'                    => '1.1.0'" in sixth
          assert "'auth_event_projection_contract'    => '1.1.0'" in sixth
          assert 'AuthenticationCompromiseReported.v1' in sixth
          assert 'AuthenticationLockdownEnabled.v1' in sixth
          assert 'RecoveryChangeCoolingStarted.v1' in sixth
          assert 'file02-executes-file00-dual-control-receipt-required-file20-renders-only' in sixth
          assert 'native-file02-security-remains-enforced-file20-does-not-fallback' in sixth
          assert '/.well-known/webauthn' in fourth and "'/.well-known/webauthn'" not in third
          assert 'notifications-runtime-3.0.0-intelligent-attention-os' in fourth
          assert 'home-news-runtime-1.0.1-ng30-amended' in fourth
          assert 'future-security-runtime-0.99.0' in sixth
          assert "'provider_schema'          => '0.25.5'" in sixth
          assert "'future_feature_count'     => 25" in sixth
          assert 'F24-FUT-001..F24-FUT-025' in sixth
          assert 'native-owners-enforce-file24-assesses-governs-file20-renders' in sixth
          assert 'declared-compatibility-target-not-runtime-detection' in sixth
          assert "'runtime_presence_must_be_verified' => true" in sixth
          assert "'staging_acceptance_implied'        => false" in sixth
          assert "'live_status_implied'               => false" in sixth
          assert 'incident-containment' in fourth and 'native-modules-enforce' in fourth
          assert 'event.stopImmediatePropagation()' in guard
          feature_ids = ['command_palette','pwa_shell','offline_mode','data_saver','recent_resume','module_circuit_breaker','last_known_good','performance_guardian','smart_navigation','keyboard_accessibility','focus_mode','split_workspace','adaptive_foldable','view_transitions','predictive_prefetch','language_direction','accessibility_center','release_rings']
          assert len(feature_ids) == 18 and all(("'"+x+"'") in future for x in feature_ids)
          all_shell = future + hard + second + third + fourth + fifth + sixth + control
          assert 'CREATE TABLE' not in all_shell and 'dbDelta(' not in all_shell and 'INSERT INTO' not in all_shell
          assert 'wp_insert_user' not in sixth and 'wp_create_user' not in sixth and 'wp_mail(' not in sixth
          for p in sorted((root/'assets/css').glob('*.css')):
              css = p.read_text(encoding='utf-8')
              assert css.count('{') == css.count('}'), f'Unbalanced CSS: {p.name}'
          print('Static File 20 v1.4.6 sixth-pass compatibility/ownership/privacy/release checks passed.')
          PY

      - name: Build deterministic production-only package and prove parity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil

          root = Path('sabri-unified-application-shell')
          release = Path('release')
          stage = release/'stage'/root.name
          extract = release/'clean-extract'
          excluded_dirs = {'tests', 'node_modules', '.git', '.github', 'coverage', '.pytest_cache', '__pycache__'}
          excluded_suffixes = {'.log', '.tmp'}

          if release.exists():
              shutil.rmtree(release)
          stage.mkdir(parents=True)

          def production_source_file(path: Path) -> bool:
              rel = path.relative_to(root)
              if any(part in excluded_dirs for part in rel.parts):
                  return False
              if path.suffix.lower() in excluded_suffixes:
                  return False
              return path.is_file()

          source_files = sorted(p for p in root.rglob('*') if production_source_file(p))
          assert source_files, 'Production source set is empty.'
          assert not any('tests' in p.relative_to(root).parts for p in source_files), 'Development tests entered production source set.'

          source_manifest = []
          for src in source_files:
              rel = src.relative_to(root)
              dest = stage/rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest)
              source_manifest.append(f"{hashlib.sha256(src.read_bytes()).hexdigest()}  {rel.as_posix()}")

          manifest_text = '\n'.join(source_manifest) + '\n'
          (stage/'MANIFEST.sha256').write_text(manifest_text, encoding='utf-8')

          staged_runtime = sorted(p.relative_to(stage).as_posix() for p in stage.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          source_runtime = sorted(p.relative_to(root).as_posix() for p in source_files)
          assert staged_runtime == source_runtime, 'Clean-stage/source file-set mismatch.'

          base = '20-sabri-unified-application-shell-1.4.6-SIXTH-TEN-ROUND-HARDENED'
          archive = release/f'{base}.zip'
          fixed_time = (2026, 8, 8, 19, 30, 0)
          with ZipFile(archive, 'w') as zf:
              for p in sorted(stage.rglob('*')):
                  if not p.is_file():
                      continue
                  arcname = (Path(root.name)/p.relative_to(stage)).as_posix()
                  info = ZipInfo(arcname, fixed_time)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  zf.writestr(info, p.read_bytes())

          with ZipFile(archive) as zf:
              names = zf.namelist()
              assert names, 'ZIP is empty.'
              assert len(names) == len(set(names)), 'Duplicate ZIP entry detected.'
              for name in names:
                  pp = PurePosixPath(name)
                  assert not pp.is_absolute(), f'Absolute ZIP path: {name}'
                  assert '..' not in pp.parts, f'Path traversal ZIP entry: {name}'
                  assert pp.parts and pp.parts[0] == root.name, f'Wrong ZIP root: {name}'
                  assert 'tests' not in pp.parts, f'Development tests present in installable ZIP: {name}'

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (release/f'{base}.sha256').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          (release/f'{base}-SOURCE-MANIFEST.sha256').write_text(manifest_text, encoding='utf-8')

          extract.mkdir(parents=True)
          with ZipFile(archive) as zf:
              zf.extractall(extract)
          extracted_root = extract/root.name
          embedded = (extracted_root/'MANIFEST.sha256').read_text(encoding='utf-8')
          external = (release/f'{base}-SOURCE-MANIFEST.sha256').read_text(encoding='utf-8')
          assert embedded == external == manifest_text, 'Embedded/external/source manifest mismatch.'

          expected = {}
          for line in manifest_text.splitlines():
              sha, rel = line.split('  ', 1)
              expected[rel] = sha
          actual_files = sorted(p.relative_to(extracted_root).as_posix() for p in extracted_root.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          assert actual_files == sorted(expected), 'Extracted package/source file-set mismatch.'
          for rel, sha in expected.items():
              actual = hashlib.sha256((extracted_root/rel).read_bytes()).hexdigest()
              assert actual == sha, f'Extracted hash mismatch: {rel}'
          assert not (extracted_root/'tests').exists(), 'Development tests directory exists in installable package.'
          assert (extracted_root/'sabri-unified-application-shell.php').is_file()
          assert (extracted_root/'includes/class-future-shell-v5-sixth-hardening.php').is_file()
          print('Deterministic production package: development exclusion, path safety and exact source parity PASS.')
          PY
          base='20-sabri-unified-application-shell-1.4.6-SIXTH-TEN-ROUND-HARDENED'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"

      - name: Write exact-head sixth-audit report
        run: |
          cat > release/FILE-20-1.4.6-SIXTH-TEN-ROUND-TEST-REPORT.md <<REPORT
          # File 20 Version 1.4.6 Sixth Ten-Round Corrective Evidence
          - Exact workflow SHA: ${{ github.sha }}
          - PHP 7.4/8.3 syntax and every repository regression/adversarial suite: PASS
          - Future Shell approved feature count: 18/18; no nineteenth feature added
          - Latest File 00/01/02/24 compatibility-target regression: PASS
          - Static compatibility metadata explicitly does not claim runtime detection: PASS
          - Native authentication/security/domain ownership remains outside File 20: PASS
          - Fifth release-ring hardening remains preserved: PASS
          - Production ZIP excludes development tests: PASS
          - ZIP path/root/duplicate-entry safety: PASS
          - Clean production source/stage/extracted package file-set and SHA-256 parity: PASS
          - Embedded MANIFEST.sha256 equals external source manifest: PASS
          - Deterministic ZIP SHA-256 and CRC validation: PASS
          - Hostinger staging accepted: NO
          - Live deployed: NO
          - Operationally accepted: NO
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: file20-1.4.6-sixth-ten-round-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.4.6-SIXTH-TEN-ROUND-HARDENED.zip
            release/20-sabri-unified-application-shell-1.4.6-SIXTH-TEN-ROUND-HARDENED.sha256
            release/20-sabri-unified-application-shell-1.4.6-SIXTH-TEN-ROUND-HARDENED-SOURCE-MANIFEST.sha256
            release/FILE-20-1.4.6-SIXTH-TEN-ROUND-TEST-REPORT.md
