name: File 20 Version 1.4.16 File01 Sanitizer Persistence Repair Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - name: Check out exact candidate source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every source and test PHP file
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            if ! output="$(php -l "$file" 2>&1)"; then
              clean="${output//$'\n'/ }"
              clean="${clean//'::'/' : : '}"
              echo "::error file=${file},title=PHP syntax failure::${clean}"
              exit 1
            fi
          done < <(find sabri-unified-application-shell -type f -name '*.php' -print0)
      - name: Run every File 20 regression/adversarial suite
        run: |
          set -euo pipefail
          for test in sabri-unified-application-shell/tests/run*.php; do
            echo "==> ${test}"
            php "${test}"
          done

  static-package:
    name: Static ownership reconciliation sanitizer renderer documentation recovery privacy and deterministic production-package parity
    needs: php-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out exact candidate source head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: JavaScript JSON CSS renderer reconciliation sanitizer and release-truth static checks
        run: |
          set -euo pipefail
          for js in sabri-unified-application-shell/assets/js/*.js; do node --check "$js"; done
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          root=Path('sabri-unified-application-shell')
          def read(p): return (root/p).read_text(encoding='utf-8')
          main=read('sabri-unified-application-shell.php')
          renderer=read('includes/class-renderer.php')
          defaults=read('includes/class-defaults.php')
          route=read('includes/class-route-security.php')
          adapter=read('includes/class-file01-reconciliation-adapter.php')
          sanitizer_test=read('tests/run-file01-reconciliation-sanitizer-regression.php')
          eleventh=read('includes/class-future-shell-v5-eleventh-hardening.php')
          resth=read('includes/class-second-eighty-rest-hardening.php')
          system=read('includes/class-system-check.php')
          safe=read('includes/class-safe-mode.php')
          concurrency=read('includes/class-plan-v4-settings-concurrency.php')
          control=read('includes/class-future-shell-v5-control-guard.php')
          future=read('includes/class-future-shell-v5.php')
          uninstall=read('uninstall.php')
          readmetxt=read('readme.txt')
          migration=read('MIGRATION.md')
          staging=read('STAGING-ACCEPTANCE.md')
          rollback=read('ROLLBACK.md')
          changelog=read('CHANGELOG.md')
          assert '* Version: 1.4.16' in main
          assert "define( 'SABRI_SHELL_VERSION', '1.4.16' );" in main
          assert 'Stable tag: 1.4.16' in readmetxt
          assert '## Upgrade to 1.4.16' in migration
          assert '20-sabri-unified-application-shell-1.4.16-FILE01-SANITIZER-PERSISTENCE-REPAIR.zip' in migration
          assert 'Record File 20 `1.4.16`' in staging
          assert '## 1.4.16 ' in changelog and '## 1.4.15 ' in changelog and '## 1.4.14 ' in changelog
          assert 'Automatic rollback **does not restore shared WordPress front-page options**' in rollback
          assert 'Do **not** rely on a raw URL containing only:' in rollback
          assert '`SafeMode::query_safe_mode_url()`' in rollback
          for helper in ['render_panel','destination_url','item_visible_to_user']:
              assert renderer.count('private static function '+helper+'(') == 1, helper
          assert 'self::item_visible_to_user(' in renderer
          assert 'self::destination_url(' in renderer
          assert 'self::render_panel(' in renderer
          assert "require_once SABRI_SHELL_PATH . 'includes/class-file01-reconciliation-adapter.php';" in main
          assert 'File01ReconciliationAdapter::register();' in main
          for hook in ['spf_owner_reconciliation_plan','spf_execute_owner_reconciliation','spf_rollback_owner_reconciliation']:
              assert hook in adapter
          for legacy in ['founder','learn','encyclopedia','doctors','clinic','videos','reels','pdf','radar','ai','network','marketplace']:
              assert "'"+legacy+"'" in adapter
          assert "'home'" not in adapter.split('public static function route_map()',1)[1].split(');',1)[0]
          assert "const COMMAND_VERSION = '1.0.1';" in adapter
          assert 'persist_settings_option' in adapter
          assert "remove_filter( $hook, $callback, 10 )" in adapter
          assert "Settings::enforce_owned_invariants( $value )" in adapter
          assert "add_filter( $hook, $callback, 10, 1 )" in adapter
          assert 'Control reproduces live defect' in sanitizer_test
          assert 'Settings::sanitize callback is restored' in sanitizer_test
          assert 'shell_navigation_reference_only' in adapter
          assert 'sabri_shell_file01_reconciliation_receipts' in adapter
          assert 'sabri_shell_file01_reconciliation_receipts' in uninstall
          assert 'FutureShellV5EleventhHardening::register();' in main
          assert 'SecondEightyRestHardening::register();' in main
          assert "CONTRACT_VERSION = '1.0.11'" in eleventh
          assert 'validated_path' in route and 'rawurldecode' in route
          assert 'page_id_collision_policy' in eleventh and 'sabri_messages' in eleventh
          assert 'block_core_registration_fallback' in eleventh
          assert 'configured_url_policy' in eleventh
          assert 'file01_foundation_scope' in eleventh
          assert 'file21_provider_only_home_right_slot' in eleventh
          assert 'file-20-shell' in eleventh and 'file-00-identity' in eleventh
          assert 'doctor-verification-authority' in system and 'doctor_roles' not in system
          assert '/sabri-shell/v1/health' in resth and 'private, no-store' in resth
          assert 'wp_validate_redirect' in safe and 'QUERY_NONCE_ACTION' in safe
          assert 'LOCK_OPTION' in concurrency and 'concurrent-settings-write' in concurrency
          assert 'LKG_LOCK_OPTION' in control and 'serialized' in control
          assert 'sabri_shell_settings_update_lock' in uninstall and 'sabri_shell_future_lkg_restore_lock' in uninstall
          assert 'const SCHEMA_VERSION       = 5;' in defaults
          features=['command_palette','pwa_shell','offline_mode','data_saver','recent_resume','module_circuit_breaker','last_known_good','performance_guardian','smart_navigation','keyboard_accessibility','focus_mode','split_workspace','adaptive_foldable','view_transitions','predictive_prefetch','language_direction','accessibility_center','release_rings']
          assert len(features)==18 and all("'"+f+"'" in future for f in features)
          assert not (root/'includes/class-home-feed.php').exists()
          assert 'CREATE TABLE' not in '\n'.join([route,adapter,eleventh,resth,system,safe,concurrency,control,future])
          for p in sorted((root/'assets/css').glob('*.css')):
              css=p.read_text(encoding='utf-8'); assert css.count('{')==css.count('}'),p.name
          print('Static File 20 v1.4.16 File01 sanitizer persistence and preserved release-truth checks PASS')
          PY

      - name: Build deterministic production-only package and prove parity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil
          root=Path('sabri-unified-application-shell'); release=Path('release')
          stage=release/'stage'/root.name; extract=release/'clean-extract'
          excluded_dirs={'tests','node_modules','.git','.github','coverage','.pytest_cache','__pycache__'}
          excluded_suffixes={'.log','.tmp'}
          if release.exists(): shutil.rmtree(release)
          stage.mkdir(parents=True)
          def prod(p):
              rel=p.relative_to(root)
              return p.is_file() and not any(x in excluded_dirs for x in rel.parts) and p.suffix.lower() not in excluded_suffixes
          source=sorted(p for p in root.rglob('*') if prod(p)); assert source
          lines=[]
          for src in source:
              rel=src.relative_to(root); dst=stage/rel; dst.parent.mkdir(parents=True,exist_ok=True); shutil.copy2(src,dst)
              lines.append(f"{hashlib.sha256(src.read_bytes()).hexdigest()}  {rel.as_posix()}")
          manifest='\n'.join(lines)+'\n'; (stage/'MANIFEST.sha256').write_text(manifest,encoding='utf-8')
          assert sorted(p.relative_to(stage).as_posix() for p in stage.rglob('*') if p.is_file() and p.name!='MANIFEST.sha256')==sorted(p.relative_to(root).as_posix() for p in source)
          base='20-sabri-unified-application-shell-1.4.16-FILE01-SANITIZER-PERSISTENCE-REPAIR'; archive=release/f'{base}.zip'
          fixed=(2026,8,29,4,30,0)
          with ZipFile(archive,'w') as zf:
              for p in sorted(stage.rglob('*')):
                  if not p.is_file(): continue
                  info=ZipInfo((Path(root.name)/p.relative_to(stage)).as_posix(),fixed); info.compress_type=ZIP_DEFLATED; info.external_attr=(0o100644 & 0xFFFF)<<16
                  zf.writestr(info,p.read_bytes())
          with ZipFile(archive) as zf:
              names=zf.namelist(); assert names and len(names)==len(set(names))
              for n in names:
                  pp=PurePosixPath(n); assert not pp.is_absolute() and '..' not in pp.parts and pp.parts[0]==root.name and 'tests' not in pp.parts
          digest=hashlib.sha256(archive.read_bytes()).hexdigest(); (release/f'{base}.sha256').write_text(f'{digest}  {archive.name}\n',encoding='utf-8')
          (release/f'{base}-SOURCE-MANIFEST.sha256').write_text(manifest,encoding='utf-8')
          extract.mkdir(parents=True); ZipFile(archive).extractall(extract); er=extract/root.name
          assert (er/'MANIFEST.sha256').read_text(encoding='utf-8')==manifest
          expected={line.split('  ',1)[1]:line.split('  ',1)[0] for line in manifest.splitlines()}
          actual=sorted(p.relative_to(er).as_posix() for p in er.rglob('*') if p.is_file() and p.name!='MANIFEST.sha256'); assert actual==sorted(expected)
          for rel,sha in expected.items(): assert hashlib.sha256((er/rel).read_bytes()).hexdigest()==sha
          assert not (er/'tests').exists() and not (er/'includes/class-home-feed.php').exists()
          assert (er/'includes/class-file01-reconciliation-adapter.php').exists()
          print('Deterministic File20 1.4.16 File01 sanitizer persistence package PASS')
          PY
          base='20-sabri-unified-application-shell-1.4.16-FILE01-SANITIZER-PERSISTENCE-REPAIR'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"

      - name: Write exact-head File01 sanitizer persistence repair report
        run: |
          cat > release/FILE-20-1.4.16-FILE01-SANITIZER-PERSISTENCE-TEST-REPORT.md <<REPORT
          # File 20 Version 1.4.16 File01 Sanitizer Persistence Repair Evidence
          - Exact candidate source SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          - Live root-cause basis: deployed File20 1.4.15 exact runtime parity was verified; File01 dry-run reached zero blockers; controlled reconciliation failed and verified compensation restored the pre-apply state.
          - Live filter trace proved the File20 proposed Founder Page ID 164 survived every pre-update/read filter, while raw DB/get_option both remained 0 and object-cache truth matched DB.
          - Root cause: the registered tab-oriented Settings::sanitize callback swallowed trusted programmatic sabri_shell_settings navigation writes before pre-update filters.
          - Correction: File20 command contract 1.0.1 uses a bounded trusted persistence path that suspends only Settings::sanitize, explicitly enforces File20 invariants, preserves all other filters, and restores the sanitizer in finally for execute/compensation/rollback.
          - Dedicated regression first reproduces the sanitizer-swallow failure and then proves execute/rollback persistence and sanitizer restoration.
          - PHP 7.4/8.3 syntax and every repository regression/adversarial suite: PASS
          - Deterministic production package parity and manifest checks: PASS
          - Live deployed 1.4.16: NO
          - File01 zero-blocker dry-run re-tested after 1.4.16 deployment: NO
          - Controlled File01 reconciliation re-applied successfully: NO
          - Operationally resolved: NO
          REPORT
      - uses: actions/upload-artifact@v4
        with:
          name: file20-1.4.16-file01-sanitizer-persistence-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.4.16-FILE01-SANITIZER-PERSISTENCE-REPAIR.zip
            release/20-sabri-unified-application-shell-1.4.16-FILE01-SANITIZER-PERSISTENCE-REPAIR.sha256
            release/20-sabri-unified-application-shell-1.4.16-FILE01-SANITIZER-PERSISTENCE-REPAIR-SOURCE-MANIFEST.sha256
            release/FILE-20-1.4.16-FILE01-SANITIZER-PERSISTENCE-TEST-REPORT.md
