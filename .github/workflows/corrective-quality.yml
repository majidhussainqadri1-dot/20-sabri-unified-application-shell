name: File 20 Version 1.3.0 Four-Plan Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} contracts and regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every plugin PHP file
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run all File 20 regression suites
        run: |
          set -euo pipefail
          php sabri-unified-application-shell/tests/run.php
          php sabri-unified-application-shell/tests/run-create-contract-layout.php
          php sabri-unified-application-shell/tests/run-central-plan-v4.php
          php sabri-unified-application-shell/tests/run-context-navigation.php
          php sabri-unified-application-shell/tests/run-plan-v4-adversarial.php
          php sabri-unified-application-shell/tests/run-plan-v4-completion.php
          php sabri-unified-application-shell/tests/run-four-plan-harmonization.php

  static-package:
    name: Four-plan ownership privacy security and deterministic package
    needs: php-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript JSON CSS and static boundaries
        run: |
          set -euo pipefail
          for js in sabri-unified-application-shell/assets/js/*.js; do node --check "$js"; done
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
          grep -Fq '* Version: 1.3.0' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq "define( 'SABRI_SHELL_VERSION', '1.3.0' );" sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq 'Stable tag: 1.3.0' sabri-unified-application-shell/readme.txt
          grep -Fq 'const IMMERSIVE' sabri-unified-application-shell/includes/class-layout.php
          grep -Fq 'sabri_shell_file25_visual_contract' sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq "'26' => array( 'Search Discovery and Ranking'" sabri-unified-application-shell/includes/class-central-plan-contract.php
          grep -Fq 'sabri_shell_file26_search_contract' sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq 'search-control-hidden-no-wordpress-fallback' sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq 'WELCOME_INTERVAL_DAYS  = 30' sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq 'single-free-tier' sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq "donor_advantage']     = false" sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq "'smail'" sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq "'verified_file_transfer'" sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq "'download_manager'" sabri-unified-application-shell/includes/class-four-plan-harmonization.php
          grep -Fq 'FourPlanHarmonization::render_search();' sabri-unified-application-shell/includes/class-renderer.php
          grep -Fq 'sabri-shell-nav-more' sabri-unified-application-shell/includes/class-renderer.php
          grep -Fq 'PublishingDashboardEntry::register();' sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq "if ( ! \$base_allowed )" sabri-unified-application-shell/includes/class-create-contract.php
          grep -Fq 'sabri_shell_create_visible_for_current_user()' sabri-unified-application-shell/includes/class-renderer.php
          grep -Fq 'ContextNavigation::register();' sabri-unified-application-shell/includes/class-plugin.php
          grep -Fq 'sabri_shell_context_navigation_fallback_url' sabri-unified-application-shell/includes/class-context-navigation.php
          grep -Fq 'SMC_Contracts::assertions' sabri-unified-application-shell/includes/class-integrations.php
          ! grep -Eq "smc_assertions_v1|_smc_official_founder|_smc_doctor_verified|_smc_trusted_publisher|post-new.php" sabri-unified-application-shell/includes/class-integrations.php sabri-unified-application-shell/includes/class-create-contract.php
          ! grep -R "'posts_per_page'[[:space:]]*=>[[:space:]]*-1" sabri-unified-application-shell/includes
          ! grep -R --line-number --include='*.php' --include='*.css' '#ff8a1f' sabri-unified-application-shell/includes sabri-unified-application-shell/assets/css sabri-unified-application-shell/sabri-unified-application-shell.php
          ! grep -R --line-number --include='*.php' -E 'premium[_ -]?only|donor[_ -]?boost|paid[_ -]?ranking' sabri-unified-application-shell/includes
          python - <<'PY'
          from pathlib import Path
          root = Path('sabri-unified-application-shell')
          for p in sorted((root / 'assets/css').glob('*.css')):
              css = p.read_text(encoding='utf-8')
              assert css.count('{') == css.count('}'), f'Unbalanced CSS: {p.name}'
          for p in sorted((root / 'assets/js').glob('*.js')):
              js = p.read_text(encoding='utf-8')
              if p.name in {'shell-corrective-1.1.1.js', 'context-navigation.js'}:
                  for forbidden in ('appendChild(', 'replaceChild(', 'insertBefore(', 'outerHTML', 'innerHTML ='):
                      assert forbidden not in js, f'Unsafe DOM mutation in {p.name}: {forbidden}'
          renderer = (root / 'includes/class-renderer.php').read_text(encoding='utf-8')
          assert 'self::render_mobile_bottom_nav(' not in renderer, 'duplicate mobile bottom navigation still invoked'
          harm = (root / 'includes/class-four-plan-harmonization.php').read_text(encoding='utf-8')
          assert "'backend_owned' => false" in harm, 'UI-only native-owner boundary missing'
          print('Static four-plan ownership, privacy, security, navigation and layout checks passed.')
          PY

      - name: Build deterministic installable package
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil
          root = Path('sabri-unified-application-shell')
          release = Path('release')
          stage = release / 'stage' / root.name
          if release.exists():
              shutil.rmtree(release)
          stage.parent.mkdir(parents=True)
          shutil.copytree(root, stage)
          files = sorted(p for p in stage.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          manifest = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.relative_to(stage).as_posix()}" for p in files]
          (stage / 'MANIFEST.sha256').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          base = '20-sabri-unified-application-shell-1.3.0-FOUR-PLAN'
          archive = release / f'{base}.zip'
          with ZipFile(archive, 'w') as zf:
              for p in sorted(stage.rglob('*')):
                  if p.is_file():
                      info = ZipInfo((Path(root.name) / p.relative_to(stage)).as_posix(), (2026, 8, 7, 14, 0, 0))
                      info.compress_type = ZIP_DEFLATED
                      info.external_attr = (0o100644 & 0xFFFF) << 16
                      zf.writestr(info, p.read_bytes())
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (release / f'{base}.sha256').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          (release / f'{base}-SOURCE-MANIFEST.sha256').write_text('\n'.join(manifest) + '\n', encoding='utf-8')
          PY
          base='20-sabri-unified-application-shell-1.3.0-FOUR-PLAN'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"
          rm -rf release/clean-extract
          mkdir -p release/clean-extract
          unzip -q "release/${base}.zip" -d release/clean-extract
          test -f release/clean-extract/sabri-unified-application-shell/sabri-unified-application-shell.php
          grep -Fq '* Version: 1.3.0' release/clean-extract/sabri-unified-application-shell/sabri-unified-application-shell.php

      - name: Write exact-head report
        run: |
          cat > release/FILE-20-1.3.0-TEST-REPORT.md <<REPORT
          # File 20 Version 1.3.0 Four-Plan Evidence

          - Exact workflow SHA: ${{ github.sha }}
          - PHP 7.4/8.3 syntax and all regression/adversarial suites: PASS
          - File 00/File 22 authorization boundaries: PASS
          - File 23 authorized Publishing Dashboard entry: PASS
          - File 25 visual ownership and green continuity fallback: PASS
          - File 26 Search/Discovery/Ranking ownership and fail-closed search mount: PASS
          - Shared Back + Home same-origin navigation contract: PASS
          - Single top navigation, More overflow, mobile drawer, no duplicate bottom strip: PASS
          - 30-day Welcome frequency-control contract: PASS
          - Single free tier and donor-neutral shell policy: PASS
          - Smail / verified file transfer / download native-owner UI contracts: PASS
          - File 00–26 registry and JSON/static boundaries: PASS
          - Deterministic package, manifest, SHA-256, ZIP CRC and clean extraction: PASS
          - Hostinger staging accepted: NO
          - Live deployed: NO
          - Operationally accepted: NO
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: file20-1.3.0-four-plan-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.3.0-FOUR-PLAN.zip
            release/20-sabri-unified-application-shell-1.3.0-FOUR-PLAN.sha256
            release/20-sabri-unified-application-shell-1.3.0-FOUR-PLAN-SOURCE-MANIFEST.sha256
            release/FILE-20-1.3.0-TEST-REPORT.md
