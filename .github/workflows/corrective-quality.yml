name: File 20 Version 1.4.10 Tenth Fresh Ten-Round Hardened Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  php-quality:
    name: PHP ${{ matrix.php }} full regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - name: Syntax-check every source and test PHP file
        run: find sabri-unified-application-shell -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run every File 20 regression/adversarial suite
        run: |
          set -euo pipefail
          for test in sabri-unified-application-shell/tests/run*.php; do
            echo "==> ${test}"
            php "${test}"
          done

  static-package:
    name: Static ownership, native slots, health, privacy and deterministic production-package parity
    needs: php-quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: JavaScript JSON CSS release and tenth-pass static checks
        run: |
          set -euo pipefail
          for js in sabri-unified-application-shell/assets/js/*.js; do node --check "${js}"; done
          python -m json.tool sabri-unified-application-shell/contracts/file20-central-plan-v4.json >/dev/null
          python - <<'PY'
          from pathlib import Path
          root = Path('sabri-unified-application-shell')
          main = (root/'sabri-unified-application-shell.php').read_text(encoding='utf-8')
          future = (root/'includes/class-future-shell-v5.php').read_text(encoding='utf-8')
          tenth = (root/'includes/class-future-shell-v5-tenth-hardening.php').read_text(encoding='utf-8')
          slots = (root/'includes/class-native-content-slots.php').read_text(encoding='utf-8')
          plugin = (root/'includes/class-plugin.php').read_text(encoding='utf-8')
          defaults = (root/'includes/class-defaults.php').read_text(encoding='utf-8')
          safe = (root/'includes/class-safe-mode.php').read_text(encoding='utf-8')
          recovery = (root/'includes/class-plan-v4-recovery.php').read_text(encoding='utf-8')
          concurrency = (root/'includes/class-plan-v4-settings-concurrency.php').read_text(encoding='utf-8')
          route = (root/'includes/class-route-security.php').read_text(encoding='utf-8')
          nav = (root/'includes/class-navigation.php').read_text(encoding='utf-8')
          uninstall = (root/'uninstall.php').read_text(encoding='utf-8')
          seventh = (root/'includes/class-future-shell-v5-seventh-hardening.php').read_text(encoding='utf-8')
          eighth = (root/'includes/class-future-shell-v5-eighth-hardening.php').read_text(encoding='utf-8')
          ninth = (root/'includes/class-future-shell-v5-ninth-hardening.php').read_text(encoding='utf-8')
          readmetxt = (root/'readme.txt').read_text(encoding='utf-8')

          assert '* Version: 1.4.10' in main
          assert "define( 'SABRI_SHELL_VERSION', '1.4.10' );" in main
          assert 'Stable tag: 1.4.10' in readmetxt
          assert 'FutureShellV5TenthHardening::register();' in main
          assert "CONTRACT_VERSION = '1.0.10'" in tenth
          assert 'const SCHEMA_VERSION       = 4;' in defaults
          assert "'appearance'            => array(" not in defaults

          feature_ids = ['command_palette','pwa_shell','offline_mode','data_saver','recent_resume','module_circuit_breaker','last_known_good','performance_guardian','smart_navigation','keyboard_accessibility','focus_mode','split_workspace','adaptive_foldable','view_transitions','predictive_prefetch','language_direction','accessibility_center','release_rings']
          assert len(feature_ids) == 18 and all(("'"+x+"'") in future for x in feature_ids)
          for cf in ['CF-01','CF-02','CF-03','CF-04','CF-05','CF-06']:
              assert f"$registry['{cf}']" in seventh

          assert 'HomeFeed::register();' not in plugin
          assert "'auto_insert' => false" in tenth and "'posts_count' => 0" in tenth
          assert "'sabri_shell_home_feed' !== sanitize_key" in tenth
          for hook in ['sabri_shell_home_before_main','sabri_shell_home_main','sabri_shell_home_after_main','sabri_shell_home_right_sidebar','sabri_shell_news_main']:
              assert hook in slots
          assert "'' !== trim( $main ) ? $main : $content" in slots
          assert 'membership-core-1.2.18-reviewed-head' in tenth
          assert "'known_external_release_blockers' => true" in tenth and "'production_safe_implied' => false" in tenth
          assert 'file26_search_surface_only' in tenth and "'file20_fallback' => false" in tenth
          assert 'bind_actual_provider_versions' in tenth and 'probe_file25_contract_shape' in tenth and 'probe_file01b_contract_shape' in tenth
          assert 'critical_health_state' in tenth and 'healthy-only-when-critical-contracts-verified' in tenth
          assert 'FutureShellV5TenthHardening::critical_health_state( $health )' in safe

          assert 'emergency_direct_write_blocked' in safe and 'emergency_write_authorized' in safe
          assert 'const SNAPSHOT_FORMAT = 2;' in recovery and "'exists' => $value !== $sentinel" in recovery
          assert 'sabri_shell_stale_repair_locked' in recovery
          assert 'plan_v4_quarantine_stale_page_bindings' in recovery and 'stale_page_binding_diff' in recovery
          assert 'record_programmatic_change' in concurrency
          assert 'current_emergency_state_preserved' in recovery and 'settings_row_version_monotonic' in recovery
          assert 'restore_option_entry' in recovery and 'rollback_option_verification_failed' in recovery
          assert "esc_url_raw( $url, array( 'https' ) )" in route
          assert 'sabri_shell_route_override_allowed_hosts' in route
          assert "option_' . Defaults::OPTION_NAME" in route
          assert "Integrations::destination_url( $key )" not in nav
          assert 'RouteSecurity::sanitize_override' in nav
          for priority in range(1,6): assert f"'source_priority'] = {priority}" in nav
          assert "empty( $settings['delete_on_uninstall'] )" in uninstall
          for option in ['sabri_shell_plan_v4_audit','sabri_shell_plan_v4_snapshots','sabri_shell_future_v5','sabri_shell_future_lkg','sabri_shell_emergency_state','sabri_shell_settings_row_version']:
              assert option in uninstall
          assert "wp_clear_scheduled_hook( 'sabri_shell_plan_v4_maintenance' )" in uninstall
          assert 'file20_appearance_editor' in eighth and 'retired' in eighth
          assert "CONTRACT_VERSION = '1.0.9'" in ninth

          all_shell = main + future + seventh + eighth + ninth + tenth + slots + plugin + defaults + safe + recovery + concurrency + route + nav + uninstall
          assert 'CREATE TABLE' not in all_shell and 'dbDelta(' not in all_shell and 'INSERT INTO' not in all_shell
          for p in sorted((root/'assets/css').glob('*.css')):
              css = p.read_text(encoding='utf-8')
              assert css.count('{') == css.count('}'), f'Unbalanced CSS: {p.name}'
          print('Static File 20 v1.4.10 tenth-pass ownership/native-slot/health/privacy/release checks passed.')
          PY

      - name: Build deterministic production-only package and prove parity
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path, PurePosixPath
          from zipfile import ZIP_DEFLATED, ZipFile, ZipInfo
          import hashlib, shutil

          root = Path('sabri-unified-application-shell')
          release = Path('release')
          stage = release/'stage'/root.name
          extract = release/'clean-extract'
          excluded_dirs = {'tests', 'node_modules', '.git', '.github', 'coverage', '.pytest_cache', '__pycache__'}
          excluded_suffixes = {'.log', '.tmp'}
          if release.exists(): shutil.rmtree(release)
          stage.mkdir(parents=True)

          def production_source_file(path: Path) -> bool:
              rel = path.relative_to(root)
              if any(part in excluded_dirs for part in rel.parts): return False
              if path.suffix.lower() in excluded_suffixes: return False
              return path.is_file()

          source_files = sorted(p for p in root.rglob('*') if production_source_file(p))
          assert source_files and not any('tests' in p.relative_to(root).parts for p in source_files)
          source_manifest = []
          for src in source_files:
              rel = src.relative_to(root)
              dest = stage/rel
              dest.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src, dest)
              source_manifest.append(f"{hashlib.sha256(src.read_bytes()).hexdigest()}  {rel.as_posix()}")
          manifest_text = '\n'.join(source_manifest) + '\n'
          (stage/'MANIFEST.sha256').write_text(manifest_text, encoding='utf-8')
          staged_runtime = sorted(p.relative_to(stage).as_posix() for p in stage.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          source_runtime = sorted(p.relative_to(root).as_posix() for p in source_files)
          assert staged_runtime == source_runtime

          base = '20-sabri-unified-application-shell-1.4.10-TENTH-TEN-ROUND-HARDENED'
          archive = release/f'{base}.zip'
          fixed_time = (2026, 8, 9, 0, 2, 0)
          with ZipFile(archive, 'w') as zf:
              for p in sorted(stage.rglob('*')):
                  if not p.is_file(): continue
                  arcname = (Path(root.name)/p.relative_to(stage)).as_posix()
                  info = ZipInfo(arcname, fixed_time)
                  info.compress_type = ZIP_DEFLATED
                  info.external_attr = (0o100644 & 0xFFFF) << 16
                  zf.writestr(info, p.read_bytes())
          with ZipFile(archive) as zf:
              names = zf.namelist()
              assert names and len(names) == len(set(names))
              for name in names:
                  pp = PurePosixPath(name)
                  assert not pp.is_absolute() and '..' not in pp.parts and pp.parts[0] == root.name and 'tests' not in pp.parts

          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (release/f'{base}.sha256').write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          (release/f'{base}-SOURCE-MANIFEST.sha256').write_text(manifest_text, encoding='utf-8')
          extract.mkdir(parents=True)
          with ZipFile(archive) as zf: zf.extractall(extract)
          extracted_root = extract/root.name
          embedded = (extracted_root/'MANIFEST.sha256').read_text(encoding='utf-8')
          external = (release/f'{base}-SOURCE-MANIFEST.sha256').read_text(encoding='utf-8')
          assert embedded == external == manifest_text
          expected = {}
          for line in manifest_text.splitlines():
              sha, rel = line.split('  ', 1); expected[rel] = sha
          actual_files = sorted(p.relative_to(extracted_root).as_posix() for p in extracted_root.rglob('*') if p.is_file() and p.name != 'MANIFEST.sha256')
          assert actual_files == sorted(expected)
          for rel, sha in expected.items(): assert hashlib.sha256((extracted_root/rel).read_bytes()).hexdigest() == sha
          assert not (extracted_root/'tests').exists()
          assert (extracted_root/'sabri-unified-application-shell.php').is_file()
          assert (extracted_root/'includes/class-future-shell-v5-tenth-hardening.php').is_file()
          assert (extracted_root/'includes/class-native-content-slots.php').is_file()
          assert (extracted_root/'includes/class-route-security.php').is_file()
          print('Deterministic 1.4.10 production package parity/path/integrity PASS.')
          PY
          base='20-sabri-unified-application-shell-1.4.10-TENTH-TEN-ROUND-HARDENED'
          (cd release && sha256sum -c "${base}.sha256")
          unzip -t "release/${base}.zip"

      - name: Write exact-head tenth-audit report
        run: |
          cat > release/FILE-20-1.4.10-TENTH-TEN-ROUND-TEST-REPORT.md <<REPORT
          # File 20 Version 1.4.10 Tenth Fresh Ten-Round Corrective Evidence
          - Exact workflow SHA: ${{ github.sha }}
          - PHP 7.4/8.3 syntax and every repository regression/adversarial suite: PASS
          - Future Shell approved feature count: 18/18; no nineteenth feature added
          - File 21 canonical Home/News ownership and retired File20 local feed runtime: PASS
          - Five exact File 21 native presentation slots and no native/legacy duplicate render: PASS
          - File 25 visual ownership and structural-only File20 body classes: PASS
          - Latest reviewed File00 1.2.18 evidence recorded without production-safe implication: PASS
          - File26-only Search surface; no WordPress/File20 fallback: PASS
          - Native semantic-version provider health binding: PASS
          - Critical File20/File00 health cannot false-green: PASS
          - Emergency re-enable critical health gate: PASS
          - Prior route/recovery/privacy/uninstall/PWA/release-ring/CF boundaries: PASS
          - Production ZIP excludes development tests: PASS
          - ZIP path/root/duplicate-entry safety: PASS
          - Clean production source/stage/extracted SHA-256 parity: PASS
          - Embedded/external manifest equality and ZIP CRC: PASS
          - Hostinger staging accepted: NO
          - Live deployed: NO
          - Operationally accepted: NO
          REPORT

      - uses: actions/upload-artifact@v4
        with:
          name: file20-1.4.10-tenth-ten-round-${{ github.sha }}
          retention-days: 60
          if-no-files-found: error
          path: |
            release/20-sabri-unified-application-shell-1.4.10-TENTH-TEN-ROUND-HARDENED.zip
            release/20-sabri-unified-application-shell-1.4.10-TENTH-TEN-ROUND-HARDENED.sha256
            release/20-sabri-unified-application-shell-1.4.10-TENTH-TEN-ROUND-HARDENED-SOURCE-MANIFEST.sha256
            release/FILE-20-1.4.10-TENTH-TEN-ROUND-TEST-REPORT.md
